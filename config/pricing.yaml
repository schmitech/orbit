# Local pricing table for estimating inference cost from token usage.
#
# This is NOT synced with any provider billing API — it is a hand-maintained
# rate table used to estimate cost per audit record. Rates drift; update
# `updated` whenever you revise a rate so the admin panel can flag staleness.
#
# Matching for a (provider, model) pair, in order:
#   1. Exact model key
#   2. Longest-matching glob pattern (fnmatch), e.g. "gpt-4o-mini" beats "gpt-4o*"
#   3. Provider-level "*" default
#   4. No match -> cost reported as unpriced (null), not zero
#
# input_per_1m / output_per_1m are USD per 1,000,000 tokens.
# A rate of 0.0 means "known to be free" (e.g. local models) and is reported
# distinctly from "unpriced" in the UI.
#
# cached_input_per_1m is an optional discounted rate for the subset of
# prompt tokens a provider serves from its own cache (Anthropic cache_control
# breakpoints, DeepSeek/xAI automatic caching). Omit it and cached tokens are
# simply priced at the full input_per_1m rate — accurate but not discounted.

pricing:
  currency: "USD"
  updated: "2026-07-30"
  stale_after_days: 120

  providers:
    openai:
      # Embeddings are input-only; output_per_1m is explicitly zero so the
      # shared token-pricing path can price them without inventing output use.
      "text-embedding-3-small": { input_per_1m: 0.02, output_per_1m: 0.0 }
      "text-embedding-3-large": { input_per_1m: 0.13, output_per_1m: 0.0 }
      "gpt-5.4-mini":  { input_per_1m: 0.25,  output_per_1m: 2.00 }
      "gpt-5*":        { input_per_1m: 1.25,  output_per_1m: 10.00 }
      "gpt-4o-mini*":  { input_per_1m: 0.15,  output_per_1m: 0.60 }
      "gpt-4o*":       { input_per_1m: 2.50,  output_per_1m: 10.00 }
      # Realtime voice models bill audio tokens at a separate, much higher
      # tier than text — see PricingService.estimate()'s audio_* args.
      "gpt-realtime*": { input_per_1m: 4.00, output_per_1m: 16.00, audio_input_per_1m: 32.00, audio_output_per_1m: 64.00 }

    # Azure AI Foundry — pricing is looked up by deployment name (self.model
    # mirrors self.deployment in azure_base.py), which is caller-chosen and
    # need not match the underlying OpenAI model name. Rates below assume the
    # common convention of naming a deployment after its base model; add an
    # exact entry keyed by your own deployment name if it diverges, or a
    # provider-level "*" default rate if you'd rather not track per-deployment.
    azure:
      "gpt-5.4-mini*": { input_per_1m: 0.25,  output_per_1m: 2.00 }
      "gpt-5*":        { input_per_1m: 1.25,  output_per_1m: 10.00 }
      "gpt-4o-mini*":  { input_per_1m: 0.15,  output_per_1m: 0.60 }
      "gpt-4o*":       { input_per_1m: 2.50,  output_per_1m: 10.00 }
      "gpt-35-turbo*": { input_per_1m: 0.50,  output_per_1m: 1.50 }
      # gpt-image deployments bill per input/output image token, same rate
      # as OpenAI's own gpt-image-1 — see AzureImageService's usage_dict.
      "gpt-image*":    { input_per_1m: 5.00,  output_per_1m: 40.00 }

    anthropic:
      "claude-opus*":    { input_per_1m: 15.00, output_per_1m: 75.00, cached_input_per_1m: 1.50 }
      "claude-sonnet*":  { input_per_1m: 3.00,  output_per_1m: 15.00, cached_input_per_1m: 0.30 }
      "claude-haiku*":   { input_per_1m: 0.80,  output_per_1m: 4.00,  cached_input_per_1m: 0.08 }

    gemini:
      # Live/realtime voice variant — was previously falling through to the
      # generic "gemini*flash*" TEXT glob below, which is the wrong rate for
      # an audio-capable live session. Verify against the current Gemini
      # Live API pricing page before relying on this for cost-sensitive use.
      "gemini-3.1-flash-live-preview*": { input_per_1m: 0.50, output_per_1m: 3.00 }
      "gemini-3.6-flash*":      { input_per_1m: 1.50, output_per_1m: 7.50 }
      "gemini-3.5-flash-lite*": { input_per_1m: 0.30, output_per_1m: 2.50 }
      "gemini-3.5-flash*":      { input_per_1m: 1.50, output_per_1m: 9.00 }
      "gemini-3.1-flash-lite*": { input_per_1m: 0.25, output_per_1m: 1.50 }
      "gemini-3.1-pro*":        { input_per_1m: 2.00, output_per_1m: 12.00 }
      "gemini-2.5-flash-lite*": { input_per_1m: 0.10, output_per_1m: 0.40 }
      "gemini-2.5-flash*":      { input_per_1m: 0.30, output_per_1m: 2.50 }
      "gemini-2.5-pro*":        { input_per_1m: 1.25, output_per_1m: 10.00 }
      "gemini*flash*":          { input_per_1m: 0.30, output_per_1m: 2.50 }
      "gemini*pro*":            { input_per_1m: 1.25, output_per_1m: 10.00 }

    xai:
      "grok-4*": { input_per_1m: 3.00, output_per_1m: 15.00 }

    mistral:
      "mistral-embed*":  { input_per_1m: 0.10, output_per_1m: 0.0 }
      "mistral-small*":  { input_per_1m: 0.10, output_per_1m: 0.30 }
      "mistral-medium*": { input_per_1m: 0.40, output_per_1m: 2.00 }
      "mistral-large*":  { input_per_1m: 2.00, output_per_1m: 6.00 }
      "codestral*":      { input_per_1m: 0.30, output_per_1m: 0.90 }

    cohere:
      # Cohere's public pricing page does not currently publish a stable
      # pay-as-you-go per-token rate for Embed; keep it explicit/unpriced.
      "embed-*":       { input_per_1m: null, output_per_1m: 0.0 }
      "command-r7b*": { input_per_1m: 0.0375, output_per_1m: 0.15 }
      "command-r*":   { input_per_1m: 0.15,   output_per_1m: 0.60 }

    voyage:
      "voyage-3-lite": { input_per_1m: 0.02, output_per_1m: 0.0 }
      "voyage-3":      { input_per_1m: 0.06, output_per_1m: 0.0 }
      "voyage-3.5-lite": { input_per_1m: 0.02, output_per_1m: 0.0 }
      "voyage-3.5":      { input_per_1m: 0.06, output_per_1m: 0.0 }
      "voyage-3-large":  { input_per_1m: 0.18, output_per_1m: 0.0 }
      "voyage-code-3":   { input_per_1m: 0.18, output_per_1m: 0.0 }
      # Rerank usage is reported as total processed tokens (input-only).
      "rerank-1":        { input_per_1m: 0.05, output_per_1m: 0.0 }
      "rerank-lite-1":   { input_per_1m: 0.02, output_per_1m: 0.0 }
      "rerank-2":        { input_per_1m: 0.05, output_per_1m: 0.0 }
      "rerank-2-lite":   { input_per_1m: 0.02, output_per_1m: 0.0 }
      "rerank-2.5":      { input_per_1m: 0.05, output_per_1m: 0.0 }
      "rerank-2.5-lite": { input_per_1m: 0.02, output_per_1m: 0.0 }

    nvidia:
      # NVIDIA NIM embedding endpoints don't publish a stable public
      # per-token rate; keep it explicit/unpriced, same as Cohere above,
      # rather than silently falling through with no entry at all.
      "*": { input_per_1m: null, output_per_1m: null }

    jina:
      # Jina AI's embedding pricing is usage-tier based, not a flat public
      # per-token rate; keep it explicit/unpriced rather than no entry.
      "*": { input_per_1m: null, output_per_1m: null }

    deepseek:
      "deepseek-chat*": { input_per_1m: 0.28, output_per_1m: 0.42, cached_input_per_1m: 0.028 }

    groq:
      "*": { input_per_1m: 0.05, output_per_1m: 0.08 }

    openrouter:
      "*": { input_per_1m: null, output_per_1m: null }

    ollama_cloud:
      "*": { input_per_1m: null, output_per_1m: null }

    # Local / self-hosted providers — free to run, reported explicitly as
    # $0.00 rather than "unpriced".
    ollama:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    llama_cpp:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    vllm:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    sglang:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    tensorrt:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    lmstudio:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    shimmy:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    transformers:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    sentence_transformers:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    bitnet:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    airllm:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }

  # Discrete-unit media pricing (images, video seconds, TTS characters, STT
  # seconds, OCR pages) — separate from the token-based `providers` table
  # above since these aren't priced per token. Same (provider, model)
  # matching order as `providers`. A provider's bare "*" entry may omit
  # `unit` entirely (see PricingService.estimate_media) since one local
  # provider (ollama, whisper, ...) can serve several media categories.
  media:
    openai:
      "dall-e-3*": { unit: "images", per_unit: 0.04 }
      "dall-e-2*": { unit: "images", per_unit: 0.02 }
      "tts-1-hd*": { unit: "characters", per_unit: 0.00003 }
      "tts-1*":    { unit: "characters", per_unit: 0.000015 }
      # Per-minute STT converted to per-second ($0.006/min / 60).
      "whisper-1*": { unit: "audio_seconds", per_unit: 0.0001 }

    gemini:
      "imagen*": { unit: "images", per_unit: 0.04 }
      "veo*":    { unit: "seconds", per_unit: 0.35 }

    xai:
      "grok-*-image*": { unit: "images", per_unit: 0.07 }
      "grok-*-video*": { unit: "seconds", per_unit: 0.35 }

    # Azure image deployments are billed by deployment name (see azure.yaml
    # note in the `providers` table above); dall-e-3/dall-e-2 bill per image
    # the same as OpenAI's own DALL-E, gpt-image deployments bill per token
    # via the `providers.azure` table instead and report no media usage.
    azure:
      "dall-e-3*": { unit: "images", per_unit: 0.04 }
      "dall-e-2*": { unit: "images", per_unit: 0.02 }

    mistral:
      # Mistral's document OCR endpoint bills per page (~$1/1000 pages).
      "mistral-ocr*": { unit: "pages", per_unit: 0.001 }

    cohere:
      # Cohere Rerank reports billed search_units.  The public pricing page
      # defines the unit but does not publish a stable per-unit API price.
      "rerank-*": { unit: "search_units", per_unit: null }

    elevenlabs:
      "*": { unit: "characters", per_unit: 0.00003 }

    # Local / self-hosted — free to run, reported explicitly as $0.00.
    ollama:
      "*": { per_unit: 0.0 }
    whisper:
      "*": { per_unit: 0.0 }
    coqui:
      "*": { per_unit: 0.0 }
    supertonic:
      "*": { per_unit: 0.0 }
    vllm:
      "*": { per_unit: 0.0 }
    llama_cpp:
      "*": { per_unit: 0.0 }
