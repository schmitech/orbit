# Local pricing table for estimating inference cost from token usage.
#
# This is NOT synced with any provider billing API — it is a hand-maintained
# rate table used to estimate cost per audit record. Rates drift; update
# `updated` whenever you revise a rate so the admin panel can flag staleness.
#
# Matching for a (provider, model) pair, in order:
#   1. Exact model key
#   2. Longest-matching glob pattern (fnmatch), e.g. "gpt-4o-mini" beats "gpt-4o*"
#   3. Provider-level "*" default
#   4. No match -> cost reported as unpriced (null), not zero
#
# input_per_1m / output_per_1m are USD per 1,000,000 tokens.
# A rate of 0.0 means "known to be free" (e.g. local models) and is reported
# distinctly from "unpriced" in the UI.

pricing:
  currency: "USD"
  updated: "2026-07-29"
  stale_after_days: 120

  providers:
    openai:
      "gpt-5.4-mini":  { input_per_1m: 0.25,  output_per_1m: 2.00 }
      "gpt-5*":        { input_per_1m: 1.25,  output_per_1m: 10.00 }
      "gpt-4o-mini*":  { input_per_1m: 0.15,  output_per_1m: 0.60 }
      "gpt-4o*":       { input_per_1m: 2.50,  output_per_1m: 10.00 }

    anthropic:
      "claude-opus*":    { input_per_1m: 15.00, output_per_1m: 75.00 }
      "claude-sonnet*":  { input_per_1m: 3.00,  output_per_1m: 15.00 }
      "claude-haiku*":   { input_per_1m: 0.80,  output_per_1m: 4.00 }

    gemini:
      "gemini-3.6-flash*":      { input_per_1m: 1.50, output_per_1m: 7.50 }
      "gemini-3.5-flash-lite*": { input_per_1m: 0.30, output_per_1m: 2.50 }
      "gemini-3.5-flash*":      { input_per_1m: 1.50, output_per_1m: 9.00 }
      "gemini-3.1-flash-lite*": { input_per_1m: 0.25, output_per_1m: 1.50 }
      "gemini-3.1-pro*":        { input_per_1m: 2.00, output_per_1m: 12.00 }
      "gemini-2.5-flash-lite*": { input_per_1m: 0.10, output_per_1m: 0.40 }
      "gemini-2.5-flash*":      { input_per_1m: 0.30, output_per_1m: 2.50 }
      "gemini-2.5-pro*":        { input_per_1m: 1.25, output_per_1m: 10.00 }
      "gemini*flash*":          { input_per_1m: 0.30, output_per_1m: 2.50 }
      "gemini*pro*":            { input_per_1m: 1.25, output_per_1m: 10.00 }

    xai:
      "grok-4*": { input_per_1m: 3.00, output_per_1m: 15.00 }

    mistral:
      "mistral-small*":  { input_per_1m: 0.10, output_per_1m: 0.30 }
      "mistral-medium*": { input_per_1m: 0.40, output_per_1m: 2.00 }
      "mistral-large*":  { input_per_1m: 2.00, output_per_1m: 6.00 }
      "codestral*":      { input_per_1m: 0.30, output_per_1m: 0.90 }

    cohere:
      "command-r7b*": { input_per_1m: 0.0375, output_per_1m: 0.15 }
      "command-r*":   { input_per_1m: 0.15,   output_per_1m: 0.60 }

    deepseek:
      "deepseek-chat*": { input_per_1m: 0.28, output_per_1m: 0.42 }

    groq:
      "*": { input_per_1m: 0.05, output_per_1m: 0.08 }

    openrouter:
      "*": { input_per_1m: null, output_per_1m: null }

    ollama_cloud:
      "*": { input_per_1m: null, output_per_1m: null }

    # Local / self-hosted providers — free to run, reported explicitly as
    # $0.00 rather than "unpriced".
    ollama:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    llama_cpp:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    vllm:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    sglang:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    tensorrt:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    lmstudio:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    shimmy:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    transformers:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    bitnet:
      "*": { input_per_1m: 0.0, output_per_1m: 0.0 }
    airllm:
