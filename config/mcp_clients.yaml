    #     AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
    #     AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"
    #   enabled: false

    # ── Playwright / Browser automation (stdio) ───────────────────────────
    # Launch a headless Chromium browser, navigate pages, take screenshots,
    # click elements, fill forms, and extract content. Requires Node + Chrome.
    # Docs: https://github.com/microsoft/playwright-mcp
    # - name: "playwright"
    #   transport: "stdio"
    #   command: "npx"
    #   args: ["-y", "@playwright/mcp@latest"]
    #   enabled: false

    # ── Microsoft 365 Work IQ MCP servers (HTTP / Entra OAuth preview) ────
    # Microsoft hosts tenant-scoped Work IQ servers for Microsoft 365 services.
    # See docs/roadmap/microsoft-365-work-iq-mcp.md before enabling these
    # placeholders: ORBIT does not yet run the required per-user OAuth flow.
    # A manually minted M365_ACCESS_TOKEN is only suitable for short-lived,
    # single-user development testing; never commit it or use it as a shared
    # production credential.
    # Docs: https://learn.microsoft.com/en-us/microsoft-agent-365/mcp-server-reference/admintools
    #
    # ── SharePoint ─────────────────────────────────────────────────────────
    # Manage sites, document libraries, files/folders, sharing, lists, list
    # items, and columns. Preview; file operations are limited to 5 MB.
    # Docs: https://learn.microsoft.com/en-us/microsoft-copilot-studio/mcp-sharepoint-work-iq
    # Tenant setup and current Work IQ permissions must be verified in Phase 0;
    # do not copy legacy Graph-scope examples into a new Work IQ integration.
    # - name: "m365-sharepoint"
    #   transport: "http"
    #   url: "https://agent365.svc.cloud.microsoft/agents/tenants/{tenantId}/servers/mcp_SharePointRemoteServer"
    #   headers:
    #     Authorization: "Bearer ${M365_ACCESS_TOKEN}"
    #   enabled: false

    # ── OneDrive ───────────────────────────────────────────────────────────
    # Manage files and folders in the signed-in user's personal OneDrive.
    # Docs: https://learn.microsoft.com/en-us/microsoft-copilot-studio/mcp-onedrive-work-iq
