# MCP Client Configuration
#
# ORBIT can connect outward to external MCP servers, discover their tools,
# and let the LLM call them in a multi-step agentic loop.
#
# Each server entry supports two transports:
#   stdio  — spawns a local subprocess (e.g. via npx, uvx, python -m …)
#   http   — connects to a remote Streamable HTTP endpoint
#
# Secrets should be supplied via environment variables using ${VAR} syntax.
# They are expanded at runtime and never written to logs.
#
# This file provides examples; edit to match your environment.
# Enable it by setting enabled: true and adding the import to config.yaml:
#
#   import:
#     - "mcp_clients.yaml"
#
# Then add "mcp-agent" to a consumer adapter's available_skills list and
# register config/adapters/mcp-agent.yaml in config/adapters.yaml.

mcp_clients:
  # Set to false to disable MCP tool calling entirely
  # (global only — cannot be overridden per server;
  #  use each server's own `enabled` for that)
  enabled: true
                                    
  # ── Defaults ─────────────────────────────────────────────────────────────
  # Every setting in this block is a DEFAULT. Any entry under `servers:` may
  # redeclare any of these keys to override it for that server alone — so a
  # slow internal HTTP server can get a longer tool_timeout without loosening
  # the budget for a fast local filesystem server.

  # Opportunistic mode gate (defense in depth). Even if an adapter sets
  # capabilities.mcp_tools: true, the inline tool-calling loop will NOT run
  # on ordinary conversational turns for a server unless that server allows
  # it. Does not affect the explicit "mcp-agent" skill (skill: "mcp-agent"
  # requests), which stays governed only by `enabled` above.
  #
  # Only tools from servers with allow_opportunistic: true are exposed on
  # ordinary turns; if no reachable server opts in, the turn falls back to
  # plain generation.
  #
  # Default false: admins must consciously widen exposure from "tools only
  # when a client asks for the mcp-agent skill" to "tools on every
  # conversational turn for adapters that request it" — MCP servers can
  # execute arbitrary local commands or reach external networks, so this is
  # a deliberate second opt-in on top of the per-adapter mcp_tools flag.
  # See docs/adapters/mcp-agent.md#opportunistic-mode.
  allow_opportunistic: false

  tool_timeout: 30                  # Seconds before a tool call is aborted
  discovery_retry_interval: 30      # Retry failed tool discovery after this many seconds; no restart needed
  discovery_timeout: 5              # Seconds before tool discovery on one server is abandoned (dials run in parallel)
  max_tool_iterations: 5            # Maximum tool-calling rounds per request. When a request can
                                    # reach several servers, the most permissive one wins.
  tool_result_max_chars: 8000       # Cap on result text injected into model context (prevents context overflow)
  pool_size: 2
  pool_idle_timeout: 300

  # ── Per-turn tool relevance filtering ──────────────────────────────────
  # With several servers enabled (especially a large one like GitHub's MCP
  # endpoint, ~70-100 tools), the full tool-schema list can be 20k-50k
  # tokens, re-sent on every iteration of the tool-calling loop. When the
  # tool count for a request exceeds max_tools, an embedding pre-filter
  # keeps only the tools relevant to the current message (plus any tool
  # already called earlier in the same thread, which is never dropped).
  # Falls back to the full tool list — never blocks a turn — if no
  # embedding provider is configured (adapter embedding_provider or the
  # global embedding.provider in embeddings.yaml).
  tool_selection:
    enabled: true
    # Keep enough candidates for multi-step MCP requests spanning several
    # domains. Set this lower only for a focused token-optimization test;
    # max_tools: 1 can make a pipeline impossible by exposing one tool only.
    max_tools: 15
    embedding_threshold: 0.3        # Cosine-similarity cutoff against the query

  servers:
    # ── Filesystem MCP server (stdio, read-only local files) ─────────────
    #
    # The directory argument is the server's allowed-directory root and must be
    # ABSOLUTE — a relative path resolves against whatever directory ORBIT was
    # started from (bin/orbit.sh does not chdir), so it silently binds
    # elsewhere if you launch from outside the repo root.
    #
    # ${ORBIT_DOCS_DIR:-/orbit/docs} keeps this line committable: the default
    # is the in-container path (docker/Dockerfile sets WORKDIR /orbit), and
    # local runs override it by setting ORBIT_DOCS_DIR in .env. Use the ":-"
    # default form — a bare ${VAR} that is unset expands to an empty string
    # with only a log warning, handing the server an empty root.
    - name: "filesystem"
      transport: "stdio"
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-filesystem", "${ORBIT_DOCS_DIR:-/orbit/docs}"]
      enabled: true
      allow_opportunistic: true
      tool_timeout: 60
      max_tool_iterations: 8
    
    # ── Business sample MCP server (Streamable HTTP) ─────────────────────
    #
    # First, set MCP_TOKEN in .env or your shell, then run:
    #
    # cd examples/mcp-server
    # MCP_TOKEN=test-secret npm start
    # 
    - name: "business-sample"
      transport: "http"
      url: "http://15.222.5.197:8080/mcp"
      headers:
        Authorization: "Bearer ${MCP_TOKEN}"
      enabled: true
      # Per-client overrides of the defaults above — remote CRM calls are
      # slower and this server is safe enough to expose on ordinary turns.
      allow_opportunistic: true

    # ════════════════════════════════════════════════════════════════════════
    # DEVELOPER WORKFLOW
    # ════════════════════════════════════════════════════════════════════════

    # ── GitHub (hosted Streamable HTTP) ───────────────────────────────────
    # Search repos, issues, PRs, commits, file contents, code.
    # GitHub hosts this endpoint; ORBIT connects to it directly — no Docker.
    # Use a fine-grained, read-only PAT in GITHUB_PAT for safe testing.
    # Docs: https://github.com/mcp/io.github.github/github-mcp-server
    - name: "github"
      transport: "http"
      url: "https://api.githubcopilot.com/mcp/"
      headers:
        Authorization: "Bearer ${GITHUB_TOKEN}"
      enabled: true
      allow_opportunistic: true
      tool_timeout: 60
      max_tool_iterations: 8
      discovery_retry_interval: 33
      discovery_timeout: 7

    # ── Azure DevOps (local stdio) ─────────────────────────────────────────
    # Work items, repositories, pull requests, pipelines, test plans, and
    # wikis. Use the official local server until ORBIT supports the hosted
    # server's Entra OAuth registration flow.
    # Docs: https://github.com/microsoft/azure-devops-mcp
    # - name: "azure-devops"
    #   transport: "stdio"
    #   command: "npx"
    #   # Keep the loaded toolset narrow; add domains only when needed.
    #   args: ["-y", "@azure-devops/mcp", "${AZURE_DEVOPS_ORGANIZATION}", "--authentication", "azcli", "-d", "core", "work", "work-items"]
    #   enabled: false
    #
    # Prerequisite: authenticate on the ORBIT host with `az login` using an
    # identity that can access AZURE_DEVOPS_ORGANIZATION. The hosted preview
    # endpoint (https://mcp.dev.azure.com/{organization}) needs OAuth support
    # tracked in docs/roadmap/microsoft-365-work-iq-mcp.md.

    # ── GitLab (stdio) ────────────────────────────────────────────────────
    # Search and manage projects, issues, MRs, and pipelines. Authenticate the
    # GitLab CLI first with `glab auth login`.
    # Docs: https://docs.gitlab.com/cli/mcp/serve/
    # - name: "gitlab"
    #   transport: "stdio"
    #   command: "glab"
    #   args: ["mcp", "serve"]
    #   enabled: false

    # ── Jira + Confluence / Atlassian (stdio) ─────────────────────────────
    # Search and manage Jira issues, Confluence pages and spaces.
    # Docs: https://github.com/sooperset/mcp-atlassian
    # - name: "atlassian"
    #   transport: "stdio"
    #   command: "uvx"
    #   args: ["mcp-atlassian"]
    #   env:
    #     JIRA_URL: "https://yourorg.atlassian.net"
    #     JIRA_USERNAME: "${ATLASSIAN_EMAIL}"
    #     JIRA_API_TOKEN: "${ATLASSIAN_API_TOKEN}"
    #     CONFLUENCE_URL: "https://yourorg.atlassian.net/wiki"
    #     CONFLUENCE_USERNAME: "${ATLASSIAN_EMAIL}"
    #     CONFLUENCE_API_TOKEN: "${ATLASSIAN_API_TOKEN}"
    #   enabled: false

    # ── Sentry (stdio) ────────────────────────────────────────────────────
    # Retrieve and analyse error events, issues, and stack traces from Sentry.
    # Docs: https://github.com/getsentry/sentry-mcp
    # - name: "sentry"
    #   transport: "stdio"
    #   command: "npx"
    #   args: ["-y", "@sentry/mcp-server@latest"]
    #   env:
    #     SENTRY_ACCESS_TOKEN: "${SENTRY_ACCESS_TOKEN}"
    #   enabled: false

    # ════════════════════════════════════════════════════════════════════════
    # COMMUNICATION
    # ════════════════════════════════════════════════════════════════════════

    # ── Slack (stdio) ─────────────────────────────────────────────────────
    # List channels/users, read channel and thread history, post messages, and
    # add reactions. Requires a Slack app with the appropriate read/write scopes.
    # Docs: https://github.com/zencoderai/slack-mcp-server
