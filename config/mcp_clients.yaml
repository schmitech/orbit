    #   transport: "stdio"
    #   command: "npx"
    #   args: ["-y", "@zencoderai/slack-mcp-server"]
    #   env:
    #     SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
    #     SLACK_TEAM_ID: "${SLACK_TEAM_ID}"
    #   enabled: false

    # ════════════════════════════════════════════════════════════════════════
    # DATA & SEARCH
    # ════════════════════════════════════════════════════════════════════════

    # ── PostgreSQL Pro / CrystalDB (stdio) ────────────────────────────────
    # High-performance Postgres integration with schema inspection, query optimization,
    # and configurable access control (--access-mode=restricted for read-only safety).
    # Docs: https://github.com/crystaldba/postgres-mcp
    # - name: "postgres-crystal"
    #   transport: "stdio"
    #   command: "npx"
    #   args: ["-y", "@crystaldba/postgres-mcp", "--access-mode=restricted"]
    #   env:
    #     DATABASE_URI: "${DATABASE_URI}"
    #   enabled: false

    # ── Brave Search (stdio) ──────────────────────────────────────────────
    # Web and local search via the Brave Search API. Useful as a standalone
    # search tool independent of a provider's native web search feature.
    # Docs: https://github.com/brave/brave-search-mcp-server
    # - name: "brave-search"
