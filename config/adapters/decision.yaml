  # Skill routing: pick which ORBIT skill should handle a query, in a few milliseconds.
  # Config-only example — it is not wired into the skill router; call it as a pre-routing step.
  - name: "skill-router"
    enabled: false
    type: "decision_model"
    datasource: "none"
    adapter: "multimodal"
    implementation: "implementations.passthrough.multimodal.MultimodalImplementation"
    decision_provider: "ollama"
    model: "tev1:0.8b"
    capabilities:
      retrieval_behavior: "none"
      formatting_style: "clean"
      supports_threading: false
      supports_session_tracking: false
    config:
      state_key: "query"
      allow_question_override: false
      questions:
        skill:
          type: "choice"
          instructions: "Which skill should handle this user request?"
          criteria:
            chat: "General conversation or questions answerable without tools"
            image: "Create or edit an image"
            video: "Create a video clip"
            document: "Produce a PDF, Word, Excel, PowerPoint, CSV or Markdown file"
            web_search: "Needs current information from the web"
            sql_analytics: "Questions about business data, metrics or reports in a database"
        needs_retrieval:
          type: "noul"
          instructions: "Does answering this request require looking up private or external data?"
