# Decision model adapters — "System One" / Jev-style models (nimble, tev1, TypeSafe jev-latest).
# Handled by DecisionModelStep; LLMInferenceStep is skipped for this adapter type.
#
# These models don't generate text. Each adapter defines a fixed set of typed questions:
#   choice — pick one option from `criteria` (mapping of option -> description)
#   noul   — yes/no; the answer is a probability between 0 and 1
#   score  — ordered rubric; `criteria` is a list of levels (lowest first), answer is the expected level
#
# The user message becomes the state: {<state_key>: message}. A client may instead send a JSON
# message: {"state": {...}, "questions": {...}}. The questions are honored only when
# allow_question_override is true.
#
# The response text is the answers JSON. The typed result ({model, answers, usage}) is also returned
# as `decision` on the done event / non-streaming result (and under `orbit.decision` on
# /v1/chat/completions).
#
# Providers are configured in config/decision.yaml:
#   ollama   — local, run `ollama pull tev1:0.8b` (ticket-triage, skill-router); `nimble` is the larger option
#   typesafe — hosted, set TYPESAFE_API_KEY
adapters:
  # Support ticket triage: route to a team, detect refund requests, estimate urgency.
  - name: "ticket-triage"
    enabled: true
    type: "decision_model"
    datasource: "none"
    adapter: "multimodal"
    implementation: "implementations.passthrough.multimodal.MultimodalImplementation"
    decision_provider: "ollama"
    model: "tev1:0.8b"          # tiny and fast; use "nimble" (9B) on a GPU box for higher accuracy
    capabilities:
      retrieval_behavior: "none"
      formatting_style: "clean"
      supports_threading: false
      supports_session_tracking: false
    config:
      state_key: "ticket"
      allow_question_override: true
      questions:
        team:
          type: "choice"
          instructions: "Which team should handle this ticket?"
          criteria:
            billing: "Payments, invoices, charges and refunds"
            technical: "Bugs, errors, outages and integrations"
            account: "Login, passwords, profile and account settings"
            other: "None of the above"
        refund_requested:
          type: "noul"
          instructions: "Does the customer explicitly ask for a refund?"
        urgency:
          type: "score"
          instructions: "How urgent is this ticket?"
          criteria: ["Routine", "Soon", "Urgent"]

  # Same ticket triage questions answered by TypeSafe's hosted model. Used by the Triage Rush
  # demo (examples/triage-rush-mq/) to switch providers per message.
  - name: "ticket-triage-typesafe"
    enabled: true
    type: "decision_model"
    datasource: "none"
    adapter: "multimodal"
    implementation: "implementations.passthrough.multimodal.MultimodalImplementation"
    decision_provider: "typesafe"
    model: "jev-latest"
    capabilities:
      retrieval_behavior: "none"
      formatting_style: "clean"
      supports_threading: false
      supports_session_tracking: false
    config:
      state_key: "ticket"
      allow_question_override: true
      questions:
        team:
          type: "choice"
          instructions: "Which team should handle this ticket?"
          criteria:
            billing: "Payments, invoices, charges and refunds"
            technical: "Bugs, errors, outages and integrations"
            account: "Login, passwords, profile and account settings"
            other: "None of the above"
        refund_requested:
          type: "noul"
          instructions: "Does the customer explicitly ask for a refund?"
        urgency:
          type: "score"
          instructions: "How urgent is this ticket?"
          criteria: ["Routine", "Soon", "Urgent"]

  # Content moderation: classify user-generated content and flag it for human review.
  - name: "content-moderation"
    enabled: false
    type: "decision_model"
    datasource: "none"
    adapter: "multimodal"
    implementation: "implementations.passthrough.multimodal.MultimodalImplementation"
    decision_provider: "typesafe"
    model: "jev-latest"
    capabilities:
      retrieval_behavior: "none"
      formatting_style: "clean"
      supports_threading: false
      supports_session_tracking: false
    config:
      state_key: "content"
      allow_question_override: false
      questions:
        category:
          type: "choice"
          instructions: "Which category best describes this content?"
          criteria:
            safe: "Benign content with no policy concerns"
            harassment: "Insults, threats or targeted abuse of a person"
            hate: "Attacks on people based on a protected attribute"
            self_harm: "Promotion or description of self-harm or suicide"
            sexual: "Sexually explicit content"
            violence: "Graphic violence or incitement to violence"
            spam: "Unsolicited advertising, scams or repetitive content"
        needs_human_review:
          type: "noul"
          instructions: "Should a human moderator review this content before it is published?"
        severity:
          type: "score"
          instructions: "How severe is the policy concern in this content?"
          criteria: ["None", "Low", "Medium", "High"]

  # Sentiment analysis (provisional): polarity, valence, sarcasm, escalation and per-aspect
  # stance. Disabled until the Phase 1 eval gate passes — see docs/roadmap/decision-model-sentiment-analysis.md.
  - name: "sentiment-analysis"
    enabled: true
    type: "decision_model"
    datasource: "none"
    adapter: "multimodal"
    implementation: "implementations.passthrough.multimodal.MultimodalImplementation"
    decision_provider: "typesafe"
    model: "jev-latest"
    capabilities:
      retrieval_behavior: "none"
      formatting_style: "clean"
      supports_threading: false
      supports_session_tracking: false
    config:
      state_key: "text"
      allow_question_override: true
      questions:
        polarity:
          type: "choice"
          instructions: "What is the author's overall stance?"
          criteria:
            positive: "Satisfied, happy or praising"
            neutral: "Factual, or no clear stance"
            negative: "Unhappy, frustrated or complaining"
            mixed: "Clearly both positive and negative, about different things"
        valence:
          type: "score"
          instructions: "On a signed scale from very negative to very positive, where does the text sit overall?"
          criteria: ["Very negative", "Negative", "Neutral", "Positive", "Very positive"]
        sarcasm:
          type: "noul"
          instructions: "Does the literal wording say the opposite of what the author means?"
        needs_escalation:
          type: "noul"
          instructions: "Does the author say they will cancel, leave or switch; report harm such as money taken wrongly, lost data, a safety issue or being locked out; or explicitly demand a reply from a person?"
        aspect_price:
          type: "choice"
          instructions: "What is the author's stance on price or value?"
          criteria: { positive: "Good value", negative: "Too expensive or poor value", not_mentioned: "Price has no clear stance or isn't discussed" }
        aspect_support:
          type: "choice"
          instructions: "What is the author's stance on customer support?"
          criteria: { positive: "Helpful support", negative: "Unhelpful or slow support", not_mentioned: "Support has no clear stance or isn't discussed" }
        aspect_product:
          type: "choice"
          instructions: "What is the author's stance on the product itself?"
          criteria: { positive: "Works well, high quality", negative: "Broken or low quality", not_mentioned: "The product has no clear stance or isn't discussed" }
        aspect_delivery:
          type: "choice"
          instructions: "What is the author's stance on shipping or delivery?"
          criteria: { positive: "Fast or on time", negative: "Late, lost or damaged", not_mentioned: "Delivery has no clear stance or isn't discussed" }

