# Intent Retriever Adapters
# These adapters use intent classification to generate queries from natural language
# Supports SQL, DuckDB, PostgreSQL, Elasticsearch, MongoDB, HTTP APIs, and Firecrawl

adapters:
  # HTTP JSON API Adapter - JSONPlaceholder (Simple Testing API)
  # This adapter uses a fake REST API for testing and debugging HTTP adapter functionality
  # No authentication required - perfect for isolating parameter extraction issues
  - name: "intent-http-jsonplaceholder"
    enabled: true
    type: "retriever"
    datasource: "http"  # Uses HTTP datasource placeholder
    adapter: "intent"
    implementation: "retrievers.implementations.intent.IntentHTTPJSONRetriever"
    inference_provider: "openai"
    model: "gpt-5.4-mini"
    embedding_provider: "ollama"
    embedding_model: "nomic-embed-text:latest"
    capabilities:
      retrieval_behavior: "always"
      formatting_style: "standard"
      supports_charts: true       # Emit chart-formatting instructions when the turn looks chart-related
      supports_file_ids: false
      supports_session_tracking: false
      supports_threading: true
      supports_autocomplete: true  # Enable autocomplete from template nl_examples
      requires_api_key_validation: true
      context_format: "toon"  # Options: markdown_table, toon, csv (default: pipe-separated)
      context_max_tokens: 8000
      numeric_precision:
        decimal_places: 2
    config:
      # Domain and template configuration
      domain_config_path: "examples/intent-templates/http-intent-template/examples/jsonplaceholder/templates/jsonplaceholder_domain.yaml"
      template_library_path:
        - "examples/intent-templates/http-intent-template/examples/jsonplaceholder/templates/jsonplaceholder_templates.yaml"

      # Vector store configuration for template matching
      template_collection_name: "jsonplaceholder_http_templates"
      store_name: "chroma"  # References stores.yaml

      # Intent matching configuration
      confidence_threshold: 0.4
      max_templates: 5
      return_results: 10
      verbose: false  # Enable debug logging

      # Template loading settings
      reload_templates_on_start: false
      force_reload_templates: false

      # HTTP-specific configuration
      base_url: "https://jsonplaceholder.typicode.com"
      default_timeout: 30
      enable_retries: true
      max_retries: 3
      retry_delay: 1.0

      # No authentication required for JSONPlaceholder

    # Fault tolerance settings
    fault_tolerance:
      operation_timeout: 30.0
      failure_threshold: 5
      recovery_timeout: 60.0
      max_retries: 3
      retry_delay: 1.0

  - name: "jsonplaceholder-realtime-voice"
    enabled: false
    type: "openai_realtime"
    datasource: "none"
    adapter: "conversational"
    implementation: "implementations.passthrough.conversational.ConversationalImplementation"
    capabilities:
      retrieval_behavior: "none"
      supports_realtime_audio: true
      supports_interruption: true
    config:
      realtime_model: "gpt-realtime"
      realtime_voice: "marin"
      enable_input_transcription: true
      grounding_adapter: "intent-http-jsonplaceholder"
      grounding_tool_name: "lookup_jsonplaceholder"
      grounding_tool_description: "Look up sample users, posts, comments, and todos."
      grounding_max_rows: 3
      grounding_max_answer_chars: 600

  - name: "paris-opendata-realtime-voice"
    enabled: false
    type: "openai_realtime"
    datasource: "none"
    adapter: "conversational"
    implementation: "implementations.passthrough.conversational.ConversationalImplementation"
    capabilities:
      retrieval_behavior: "none"
      supports_realtime_audio: true
      supports_interruption: true
    config:
      realtime_model: "gpt-realtime"
      realtime_voice: "marin"
      enable_input_transcription: true
      grounding_adapter: "intent-http-paris-opendata"
      grounding_tool_name: "lookup_paris_open_data"
      grounding_tool_description: "Look up facts from the configured Paris open-data source."
      grounding_max_rows: 3
      grounding_max_answer_chars: 600

  - name: "firecrawl-realtime-voice"
    enabled: false
    type: "openai_realtime"
    datasource: "none"
    adapter: "conversational"
    implementation: "implementations.passthrough.conversational.ConversationalImplementation"
    capabilities:
      retrieval_behavior: "none"
      supports_realtime_audio: true
      supports_interruption: true
    config:
      realtime_model: "gpt-realtime"
      realtime_voice: "marin"
      enable_input_transcription: true
      grounding_adapter: "intent-firecrawl-webscrape"
      grounding_tool_name: "lookup_web_content"
      grounding_tool_description: "Look up facts from configured web content sources."
      grounding_max_rows: 3
      grounding_max_answer_chars: 600

  - name: "spacex-realtime-voice"
    enabled: false
    type: "openai_realtime"
    datasource: "none"
    adapter: "conversational"
    implementation: "implementations.passthrough.conversational.ConversationalImplementation"
    capabilities:
      retrieval_behavior: "none"
      supports_realtime_audio: true
      supports_interruption: true
    config:
      realtime_model: "gpt-realtime"
      realtime_voice: "marin"
      enable_input_transcription: true
      grounding_adapter: "intent-graphql-spacex"
      grounding_tool_name: "lookup_spacex_data"
      grounding_tool_description: "Look up SpaceX launches, missions, and vehicle facts."
      grounding_max_rows: 3
      grounding_max_answer_chars: 600

  - name: "intent-agent-realtime-voice"
    enabled: false
    type: "openai_realtime"
    datasource: "none"
    adapter: "conversational"
    implementation: "implementations.passthrough.conversational.ConversationalImplementation"
    capabilities:
      retrieval_behavior: "none"
      supports_realtime_audio: true
      supports_interruption: true
    config:
      realtime_model: "gpt-realtime"
      realtime_voice: "marin"
      enable_input_transcription: true
      grounding_adapter: "intent-agent-example"
      grounding_tool_name: "lookup_agent_information"
      grounding_tool_description: "Look up facts using the configured intent-agent tools."
      grounding_max_rows: 3
      grounding_max_answer_chars: 600

  # GraphQL Intent Adapter - SpaceX API
  # This adapter demonstrates GraphQL query generation from natural language
  # Uses the public SpaceX GraphQL API (no authentication required)
  - name: "intent-graphql-spacex"
    enabled: true
    type: "retriever"
    datasource: "http"  # Uses HTTP datasource placeholder
    adapter: "intent"
    implementation: "retrievers.implementations.intent.IntentGraphQLRetriever"
    inference_provider: "cohere"
    embedding_provider: "ollama"
    embedding_model: "nomic-embed-text:latest"
    capabilities:
      retrieval_behavior: "always"
      formatting_style: "standard"
      supports_charts: true       # Emit chart-formatting instructions when the turn looks chart-related
      supports_file_ids: false
      supports_session_tracking: false
      supports_threading: true
      supports_autocomplete: true  # Enable autocomplete from template nl_examples
      requires_api_key_validation: true
      context_format: "toon"  # Options: markdown_table, toon, csv (default: pipe-separated)
      context_max_tokens: 8000
      numeric_precision:
        decimal_places: 2
    config:
      # Domain and template configuration
      domain_config_path: "examples/intent-templates/graphql-intent-template/examples/spacex/templates/spacex_domain.yaml"
      template_library_path:
        - "examples/intent-templates/graphql-intent-template/examples/spacex/templates/spacex_templates.yaml"

      # Vector store configuration for template matching
      template_collection_name: "graphql_spacex_templates"
      store_name: "chroma"  # References stores.yaml

      # Intent matching configuration
      confidence_threshold: 0.4
      max_templates: 5
      return_results: 20

      # Template loading settings
      reload_templates_on_start: false
      force_reload_templates: false

      # GraphQL-specific configuration
      base_url: "https://spacex-production.up.railway.app"
      graphql_endpoint: "/graphql"
      supports_introspection: true
      default_timeout: 30
      enable_retries: true
      max_retries: 3
      retry_delay: 1.0

    # Fault tolerance settings
    fault_tolerance:
      operation_timeout: 30.0
      failure_threshold: 5
      recovery_timeout: 60.0
      max_retries: 3
      retry_delay: 1.0

  # =============================================================================
  # AGENT ADAPTER - Function Calling with Built-in Tools
  # =============================================================================
  # This adapter demonstrates function-calling capabilities inspired by
  # FunctionGemma patterns. Supports built-in tools (calculator, date_time,
  # json_transform) and HTTP-based tool calls defined in YAML templates.
  #
  # Key Features:
  # - YAML-defined tools with function_schema and execution config
  # - Configurable model for function calling (separate or same as inference)
  # - Built-in tools for common operations
  # - Response synthesis for natural language output
  - name: "intent-agent-example"
    enabled: false
    type: "retriever"
    datasource: "http"
    adapter: "intent"
    implementation: "retrievers.implementations.intent.IntentAgentRetriever"
    
    # Model configuration - supports both single-model and multi-model patterns
    inference_provider: "openai"
    model: "gpt-5.4-mini"              # Main inference model
    embedding_provider: "ollama"
    embedding_model: "nomic-embed-text:latest"
    
    capabilities:
      retrieval_behavior: "always"
      formatting_style: "standard"
      supports_charts: true       # Emit chart-formatting instructions when the turn looks chart-related
      supports_file_ids: false
      supports_session_tracking: false
      supports_threading: false
      supports_autocomplete: true
      requires_api_key_validation: true
      context_format: "toon"  # Options: markdown_table, toon, csv (default: pipe-separated)
      context_max_tokens: 8000
      numeric_precision:
        decimal_places: 2    
    config:
      # Optional: Dedicated function-calling model (FunctionGemma-style)
      # If not set, uses main inference model for function calling
      function_model_provider: "ollama"
      function_model: "functiongemma"  # Uncomment to use separate function model
      
      # Tool/Template configuration
      domain_config_path: "examples/intent-templates/agent-template/domain.yaml"
      template_library_path:
        - "examples/intent-templates/agent-template/tools.yaml"
      
      # Vector store for template matching
      template_collection_name: "agent_tools"
      store_name: "chroma"
      confidence_threshold: 0.4
      max_templates: 5
      return_results: 10
      
      # Agent-specific settings
      enable_builtin_tools: true   # Enable calculator, date_time, json_transform
      function_output_format: "json"  # json or text
      synthesize_response: true    # Generate natural language response
      verbose: false               # Enable debug logging
      
      # Template loading settings
      reload_templates_on_start: false
      force_reload_templates: false
      
      # HTTP configuration (base_url required even for builtin tools)
      base_url: "http://localhost:8080"  # Placeholder for HTTP tools
      default_timeout: 30
    
    # Fault tolerance settings
    fault_tolerance:
      operation_timeout: 30.0
      failure_threshold: 5
      recovery_timeout: 60.0
      max_retries: 3
      retry_delay: 1.0
