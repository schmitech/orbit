# EXTERNAL SEARCH PROVIDER ADAPTERS
#
# These adapters call a dedicated external search API, then use any configured LLM
# to synthesize the answer — searching and synthesis are decoupled.
#
# MECHANISM: type "web-search"
#   WebSearchStep fires, calls the configured provider, populates
#   context.formatted_context with a numbered snippet list and context.sources.
#   LLMInferenceStep then synthesizes a response using any LLM provider.
#
# AVAILABLE PROVIDERS (web_search.provider key):
#   duckduckgo   — free, no API key, best for private queries
#   searxng      — free, self-hosted (set SEARXNG_URL)
#   brave        — requires BRAVE_SEARCH_API_KEY
#   serper       — Google results, requires SERPER_API_KEY
#   tavily       — AI-native search, requires TAVILY_API_KEY
#   google_pse   — requires GOOGLE_PSE_API_KEY + GOOGLE_PSE_ENGINE_ID
#   perplexity   — requires PERPLEXITY_API_KEY
#   deepseek     — requires DEEPSEEK_API_KEY
#   webz         — requires WEBZ_API_KEY; endpoint_url selects among its posts-shaped
#                  endpoints only — News API Lite (default), Blogs, Forums. Other
#                  Webz.io endpoints (Reviews, Dark Web, etc.) are not supported.
#   keenable     — optional KEENABLE_API_KEY; without a key it uses Keenable's keyless
#                  endpoint, rate limited per IP. app_title sets X-Keenable-Title
#                  (default "orbit").
#
# ALTERNATIVE: for provider-native search (Gemini GoogleSearch grounding,
#   OpenAI web_search_preview, xAI Grok search) in a single API call, see:
#   config/adapters/web-search.yaml
#
# DOCS: docs/adapters/web-search.md
#
# WEB_SEARCH BLOCK OPTIONS
#   provider:          Required. One of the provider keys listed above.
#   result_count:      Number of results to fetch (default: 5)
#   filter_list:       Optional domain substring whitelist
#   api_key:           Required for Brave, Serper, Tavily, Google PSE, Perplexity, Webz
#   endpoint_url:      All httpx-based providers (not DuckDuckGo) — overrides the
#                      provider's default request URL. Full URL, path included.
#                      Takes precedence over a provider's legacy alias (api_url/
#                      query_url) whenever set, even if blank — a blank endpoint_url
#                      is a config error, not a fallback to a working legacy value.
#   query_url:         SearXNG only — DEPRECATED alias for endpoint_url. Base URL of
#                      your instance. SearXNG requires at least one of endpoint_url/
#                      query_url — neither has a hardcoded default. Both may be set
#                      at once during a migration; endpoint_url wins.
#   search_engine_id:  Google PSE only
#   api_url:           Perplexity only — DEPRECATED alias for endpoint_url. Override
#                      for custom deployments.
#   backend:           DuckDuckGo only — auto, google, brave, etc.
#
# NOTE on allowed_search_providers: a runtime-selected entry REPLACES the adapter's
# static web_search block entirely — endpoint_url is not inherited from it. Set
# endpoint_url on each allowed_search_providers entry that needs a non-default URL.
#
# TEST EXAMPLE (DuckDuckGo — no API key needed):
#   curl -X POST http://localhost:3000/v1/chat \
#     -H "Content-Type: application/json" \
#     -H "X-API-Key: <key for an adapter that allows web-search-duckduckgo>" \
#     -d '{"messages":[{"role":"user","content":"What are today'\''s top news headlines?"}],
#          "skill":"web-search-duckduckgo"}'
#
# RUNTIME BACKEND SWITCHING: web-search-duckduckgo also declares
# allowed_search_providers, letting a client pick a different search backend at
# request time via the "model" field (matched by name — e.g. "brave", "serper"),
# without needing a separate adapter/API key per backend:
#   curl -X POST http://localhost:3000/v1/chat \
#     -H "Content-Type: application/json" \
#     -H "X-API-Key: <key for an adapter that allows web-search-duckduckgo>" \
#     -d '{"messages":[{"role":"user","content":"..."}],
#          "skill":"web-search-duckduckgo","model":"brave"}'

adapters:

  # ── DuckDuckGo ──────────────────────────────────────────────────────────────
  # Free, no API key required. Best for quick/private queries.
  - name: "web-search-duckduckgo"
    enabled: true
    type: "web-search"
    datasource: "none"
    adapter: "conversational"
    implementation: "implementations.passthrough.conversational.ConversationalImplementation"
    inference_provider: "anthropic"
    model: "claude-sonnet-5-5"
    # Lets a client pick which search backend this adapter uses at runtime (mirrors
    # allowed_image_models/allowed_video_models/allowed_audio_models). Unlike those,
    # there's no separate LLM to pick here — the backend itself is the selectable
    # thing, so entries carry the same shape as the 'web_search' block below rather
    # than a provider/model pair. Required API keys/URLs still come from env vars.
    allowed_search_providers:
      - name: "duckduckgo"
        provider: "duckduckgo"
        result_count: 5
      - name: "brave"
        provider: "brave"
        api_key: "${BRAVE_SEARCH_API_KEY}"
        result_count: 5
      - name: "searxng"
        provider: "searxng"
        query_url: "${SEARXNG_URL}"
        result_count: 5
      - name: "serper"
        provider: "serper"
        api_key: "${SERPER_API_KEY}"
        result_count: 5
      - name: "tavily"
        provider: "tavily"
        api_key: "${TAVILY_API_KEY}"
        result_count: 5
      - name: "perplexity"
        provider: "perplexity"
        api_key: "${PERPLEXITY_API_KEY}"
        result_count: 5
      - name: "google-pse"
        provider: "google_pse"
        api_key: "${GOOGLE_PSE_API_KEY}"
        search_engine_id: "${GOOGLE_PSE_ENGINE_ID}"
        result_count: 5
      - name: "deepseek"
        provider: "deepseek"
        api_key: "${DEEPSEEK_API_KEY}"
        result_count: 5
      - name: "webz"
        provider: "webz"
        api_key: "${WEBZ_API_KEY}"
        result_count: 5
    web_search:
      provider: "duckduckgo"
      result_count: 5
      # backend: "auto"   # optional: auto, duckduckgo, google, brave, etc.
    capabilities:
      supports_threading: false  # Conversational/web-search adapters do not thread conversations on a retrieved dataset
      expose_as_skill: true
      skill_name: "web-search-providers"
      skill_description: "Search the web using DuckDuckGo (free, no API key)"
      retrieval_behavior: "none"
      formatting_style: "standard"
      requires_api_key_validation: false

  # ── Brave Search ─────────────────────────────────────────────────────────────
  # Requires a Brave Search API key (https://brave.com/search/api/).
  - name: "web-search-brave"
    enabled: false
    type: "web-search"
    datasource: "none"
    adapter: "conversational"
    implementation: "implementations.passthrough.conversational.ConversationalImplementation"
    inference_provider: "anthropic"
    model: "claude-sonnet-5-5"
    web_search:
      provider: "brave"
      api_key: "${BRAVE_SEARCH_API_KEY}"
      result_count: 5
    capabilities:
      supports_threading: false  # Conversational/web-search adapters do not thread conversations on a retrieved dataset
      expose_as_skill: true
      skill_name: "web-search-brave"
      skill_description: "Search the web using Brave Search API"
      retrieval_behavior: "none"
      formatting_style: "standard"
      requires_api_key_validation: false

  # ── SearXNG (self-hosted) ────────────────────────────────────────────────────
  # Requires a running SearXNG instance. Set query_url to your instance URL.
  - name: "web-search-searxng"
    enabled: false
    type: "web-search"
    datasource: "none"
    adapter: "conversational"
    implementation: "implementations.passthrough.conversational.ConversationalImplementation"
    inference_provider: "anthropic"
    model: "claude-sonnet-5-5"
    web_search:
      provider: "searxng"
      query_url: "${SEARXNG_URL}"   # e.g. http://localhost:8080
      result_count: 5
      # language: "en"
      # safesearch: "1"
      # categories: ["general"]
    capabilities:
      supports_threading: false  # Conversational/web-search adapters do not thread conversations on a retrieved dataset
      expose_as_skill: true
      skill_name: "web-search-searxng"
      skill_description: "Search the web using a self-hosted SearXNG instance"
      retrieval_behavior: "none"
      formatting_style: "standard"
      requires_api_key_validation: false

  # ── Serper (Google via serper.dev) ───────────────────────────────────────────
  # Requires a Serper API key (https://serper.dev/).
  - name: "web-search-serper"
    enabled: false
    type: "web-search"
    datasource: "none"
    adapter: "conversational"
    implementation: "implementations.passthrough.conversational.ConversationalImplementation"
    inference_provider: "ollama_cloud"
    model: "gpt-oss:120b"
    web_search:
      provider: "serper"
      api_key: "${SERPER_API_KEY}"
      result_count: 5
    capabilities:
      supports_threading: false  # Conversational/web-search adapters do not thread conversations on a retrieved dataset
      expose_as_skill: true
      skill_name: "web-search-serper"
      skill_description: "Search Google via the Serper API"
      retrieval_behavior: "none"
      formatting_style: "standard"
      requires_api_key_validation: false

  # ── Tavily ───────────────────────────────────────────────────────────────────
  # AI-native search API. Requires a Tavily API key (https://tavily.com/).
  - name: "web-search-tavily"
    enabled: false
    type: "web-search"
    datasource: "none"
    adapter: "conversational"
    implementation: "implementations.passthrough.conversational.ConversationalImplementation"
    inference_provider: "anthropic"
    model: "claude-sonnet-5-5"
    web_search:
      provider: "tavily"
      api_key: "${TAVILY_API_KEY}"
      result_count: 5
    capabilities:
      supports_threading: false  # Conversational/web-search adapters do not thread conversations on a retrieved dataset
      expose_as_skill: true
      skill_name: "web-search-tavily"
      skill_description: "Search the web using Tavily AI search"
      retrieval_behavior: "none"
      formatting_style: "standard"
      requires_api_key_validation: false

  # ── Perplexity Search ────────────────────────────────────────────────────────
  # Requires a Perplexity API key (https://docs.perplexity.ai/docs/search/quickstart).
  # Returns structured results (link, title, snippet) from the /search endpoint.
  - name: "web-search-perplexity"
    enabled: false
    type: "web-search"
    datasource: "none"
    adapter: "conversational"
    implementation: "implementations.passthrough.conversational.ConversationalImplementation"
    inference_provider: "anthropic"
    model: "claude-sonnet-5-5"
    web_search:
      provider: "perplexity"
      api_key: "${PERPLEXITY_API_KEY}"
      result_count: 5
      # api_url: "https://api.perplexity.ai/search"  # override for custom deployments
    capabilities:
      supports_threading: false  # Conversational/web-search adapters do not thread conversations on a retrieved dataset
      expose_as_skill: true
      skill_name: "web-search-perplexity"
      skill_description: "Search the web using Perplexity Search API"
      retrieval_behavior: "none"
      formatting_style: "standard"
      requires_api_key_validation: false

  # ── Google Programmable Search Engine ───────────────────────────────────────
  # Requires a Google API key and a Custom Search Engine ID.
  # See: https://programmablesearchengine.google.com/
  - name: "web-search-google-pse"
    enabled: false
    type: "web-search"
    datasource: "none"
    adapter: "conversational"
    implementation: "implementations.passthrough.conversational.ConversationalImplementation"
    inference_provider: "anthropic"
    model: "claude-sonnet-5-5"
    web_search:
      provider: "google_pse"
      api_key: "${GOOGLE_PSE_API_KEY}"
      search_engine_id: "${GOOGLE_PSE_ENGINE_ID}"
      result_count: 5
    capabilities:
      supports_threading: false  # Conversational/web-search adapters do not thread conversations on a retrieved dataset
      expose_as_skill: true
      skill_name: "web-search-google-pse"
      skill_description: "Search Google via Programmable Search Engine"
      retrieval_behavior: "none"
      formatting_style: "standard"
      requires_api_key_validation: false

  # ── Webz.io News API Lite ────────────────────────────────────────────────────
  # Requires a Webz.io API key (https://webz.io/products/news-api).
  - name: "web-search-webz"
    enabled: false
    type: "web-search"
    datasource: "none"
    adapter: "conversational"
    implementation: "implementations.passthrough.conversational.ConversationalImplementation"
    inference_provider: "anthropic"
    model: "claude-sonnet-5-5"
    web_search:
      provider: "webz"
      api_key: "${WEBZ_API_KEY}"
      result_count: 5
    capabilities:
      supports_threading: false  # Conversational/web-search adapters do not thread conversations on a retrieved dataset
      expose_as_skill: true
      skill_name: "web-search-webz"
      skill_description: "Search news and web content using the Webz.io News API"
      retrieval_behavior: "none"
      formatting_style: "standard"
      requires_api_key_validation: false

  # ── Keenable ─────────────────────────────────────────────────────────────────
  # Works without an API key (keyless endpoint, rate limited per IP);
  # KEENABLE_API_KEY lifts the keyless limits. https://docs.keenable.ai
  - name: "web-search-keenable"
    enabled: false
    type: "web-search"
    datasource: "none"
    adapter: "conversational"
    implementation: "implementations.passthrough.conversational.ConversationalImplementation"
    inference_provider: "anthropic"
    model: "claude-sonnet-5-5"
    web_search:
      provider: "keenable"
      api_key: "${KEENABLE_API_KEY:-}"
      result_count: 5
    capabilities:
      supports_threading: false  # Conversational/web-search adapters do not thread conversations on a retrieved dataset
      expose_as_skill: true
      skill_name: "web-search-keenable"
      skill_description: "Search the web using Keenable"
      retrieval_behavior: "none"
      formatting_style: "standard"
      requires_api_key_validation: false

  # ── Webz.io Blogs (endpoint_url override example) ───────────────────────────
  # Points at Webz.io's Blogs endpoint instead of the default News API Lite
  # endpoint — demonstrates endpoint_url. Blogs is documented by Webz.io as
  # posts-shaped, the same response shape webz.py already parses, so no new
  # parsing code is needed for this example.
  # NOTE: WEBZ_API_KEY must be a token with Blogs product access — Webz.io
  # grants access per product/endpoint, so a token that only has News API
  # Lite access will be rejected (or return no results) when pointed here,
  # even though the same env var name is reused for convenience.
  - name: "web-search-webz-blogs"
    enabled: false
    type: "web-search"
    datasource: "none"
    adapter: "conversational"
    implementation: "implementations.passthrough.conversational.ConversationalImplementation"
    inference_provider: "anthropic"
    model: "claude-sonnet-5-5"
    web_search:
      provider: "webz"
      api_key: "${WEBZ_API_KEY}"
      endpoint_url: "${WEBZ_BLOGS_API_URL:-https://api.webz.io/api/blogs}"
      result_count: 5
    capabilities:
      supports_threading: false  # Conversational/web-search adapters do not thread conversations on a retrieved dataset
      expose_as_skill: true
      skill_name: "web-search-webz-blogs"
      skill_description: "Search blog content using the Webz.io Blogs API"
      retrieval_behavior: "none"
      formatting_style: "standard"
      requires_api_key_validation: false

  # ── DeepSeek Search ──────────────────────────────────────────────────────────
  # Requires a DeepSeek API key (https://api-docs.deepseek.com/guides/search/).
  - name: "web-search-deepseek"
    enabled: false
    type: "web-search"
    datasource: "none"
    adapter: "conversational"
    implementation: "implementations.passthrough.conversational.ConversationalImplementation"
    inference_provider: "anthropic"
    model: "claude-sonnet-5-5"
    web_search:
      provider: "deepseek"
      api_key: "${DEEPSEEK_API_KEY}"
      result_count: 5
    capabilities:
      supports_threading: false  # Conversational/web-search adapters do not thread conversations on a retrieved dataset
      expose_as_skill: true
      skill_name: "web-search-deepseek"
      skill_description: "Search the web using the DeepSeek Search API"
      retrieval_behavior: "none"
      formatting_style: "standard"
      requires_api_key_validation: false
