# Sensor & Threat Telemetry (SQLite) adapter
# Real-time threat-analysis demo: simulated sensor network reporting
# detections and alerts. See examples/intent-templates/sql-intent-template/
# sqlite/threat-telemetry/THREAT_TELEMETRY_README.md for the full walkthrough.

adapters:
  - name: "intent-sql-sqlite-threat-telemetry"
    enabled: true
    type: "retriever"
    datasource: "sqlite"
    adapter: "intent"
    implementation: "retrievers.implementations.intent.IntentSQLiteRetriever"
    database: "examples/intent-templates/sql-intent-template/sqlite/threat-telemetry/threat_telemetry.db"
    inference_provider: "ollama_cloud"
    model: "nemotron-3-ultra"
    embedding_provider: "ollama"
    embedding_model: "nomic-embed-text:latest"
    allowed_models:
      - name: "minimax-m3"
        provider: "ollama_cloud"
        model: "minimax-m3:cloud"
        context_window: 512000
        max_tokens: 32768
        effort: "high"
      - name: "minimax-m2.7"
        provider: "ollama_cloud"
        model: "minimax-m2.7:cloud"
        context_window: 200000
        max_tokens: 24576
        effort: "medium"
      - name: "glm-5.2"
        provider: "ollama_cloud"
        model: "glm-5.2:cloud"
        context_window: 976000
        max_tokens: 32768
        effort: "high"
      - name: "glm-5.1"
        provider: "ollama_cloud"
        model: "glm-5.1:cloud"
        context_window: 198000
        max_tokens: 24576
        effort: "high"
      - name: "glm-5.3-flash"
        provider: "ollama_cloud"
        model: "glm-5.3-flash"
        context_window: 1000000
        max_tokens: 32768
        effort: "low"
      - name: "kimi-k3"
        provider: "ollama_cloud"
        model: "kimi-k3:cloud"
        context_window: 1000000
        max_tokens: 32768
        effort: "high"
      - name: "kimi-k2.7-code"
        provider: "ollama_cloud"
        model: "kimi-k2.7-code:cloud"
        context_window: 256000
        max_tokens: 24576
        effort: "high"
      - name: "deepseek-v4-pro"
        provider: "ollama_cloud"
        model: "deepseek-v4-pro:cloud"
        context_window: 1000000
        max_tokens: 49152
        effort: "high"
      - name: "qwen3.5"
        provider: "ollama_cloud"
        model: "qwen3.5:cloud"
        context_window: 256000
        max_tokens: 16384
        effort: "medium"
      - name: "qwen3.5-397b"
        provider: "ollama_cloud"
        model: "qwen3.5:397b-cloud"
        context_window: 256000
        max_tokens: 32768
        effort: "high"
      - name: "gemma4"
        provider: "ollama_cloud"
        model: "gemma4:cloud"
        context_window: 256000
        max_tokens: 16384
        effort: "low"
      - name: "gemma4-31b"
        provider: "ollama_cloud"
        model: "gemma4:31b-cloud"
        context_window: 256000
        max_tokens: 24576
        effort: "low"
      - name: "mistral-large-3"
        provider: "ollama_cloud"
        model: "mistral-large-3:675b-cloud"
        context_window: 256000
        max_tokens: 32768
      - name: "cohere"
        provider: "cohere"
        model: "command-a-03-2025"
        context_window: 256000
        max_tokens: 8000
      - name: "grok-4.6"
        provider: "xai"
        model: "grok-4.6"
        context_window: 1000000
        max_tokens: 16000
        effort: "low"           # Maps to reasoning_effort; ignored for models that don't support it (e.g. grok-4.3)
      - name: "gemma4-e2b"
        provider: "ollama"
        model: "gemma4-e2b-cpu"
        context_window: 8192
        max_tokens: 2048
      - name: "gpt-oss:120b"
        provider: "ollama_cloud"
        model: "gpt-oss:120b-cloud"
        context_window: 131072
        max_tokens: 32768
        effort: "medium"
      - name: "gpt-oss-20b"
        provider: "ollama_cloud"
        model: "gpt-oss:20b-cloud"
        context_window: 131072
        max_tokens: 16384
        effort: "low"
      - name: "claude"
        provider: "anthropic"
        model: "claude-sonnet-4-5-20250929"
        context_window: 1000000
        max_tokens: 64000
        effort: "low"           # Ignored for Claude models that don't support the effort parameter
      - name: "nemotron-3-ultra"
        provider: "ollama_cloud"
        model: "nemotron-3-ultra:cloud"
        context_window: 256000
        max_tokens: 32768
        effort: "high"
      - name: "nemotron-3-super"
        provider: "ollama_cloud"
        model: "nemotron-3-super:cloud"
        context_window: 256000
        max_tokens: 32768
        effort: "high"
    capabilities:
      expose_as_skill: true
      skill_name: "Threat Telemetry"
      skill_description: "Sensor network detections, alerts, and sensor status"
      retrieval_behavior: "always"
      formatting_style: "standard"
      supports_charts: true       # Emit chart-formatting instructions when the turn looks chart-related
      supports_file_ids: false
      supports_session_tracking: false
      supports_threading: true
      requires_api_key_validation: true
      # Auto-route these from plain natural language (e.g. "make a pdf of
      # this") without requiring the client to send skill=<name> — matches
      # the same list as available_skills below, so both the "/" picker and
      # an autocomplete-suggested phrase reach the skill.
      auto_routable_skills:
        - "PDF"
        - "Word"
        - "Excel"
        - "PowerPoint"
      available_skills:
        - "PDF"
        - "Word"
        - "Excel"
        - "PowerPoint"
      auto_skill_routing: true
      supports_autocomplete: true
      context_format: "toon"
      context_max_tokens: 8000
      numeric_precision:
        decimal_places: 2
    config:
      check_same_thread: false
      domain_config_path: "examples/intent-templates/sql-intent-template/sqlite/threat-telemetry/threat-telemetry-domain.yaml"
      template_library_path:
        - "examples/intent-templates/sql-intent-template/sqlite/threat-telemetry/threat-telemetry-templates.yaml"
      template_collection_name: "threat_telemetry_intent_templates"
      store_name: "chroma"
      confidence_threshold: 0.4
      max_templates: 5
      return_results: 10
      clarification_enabled: true
      clarification_high_threshold: 0.65
      clarification_ambiguity_gap: 0.05
      clarification_max_rounds: 2
      clarification_ttl_seconds: 300
      reload_templates_on_start: false
      force_reload_templates: false
      use_connection_pool: false
      pool_size: 1
      connection_timeout: 30
      enable_query_monitoring: true
      query_timeout: 5000

    fault_tolerance:
      operation_timeout: 30.0
      failure_threshold: 5
      recovery_timeout: 60.0
      max_retries: 3
      retry_delay: 1.0
