# Multimodal Adapters
# These adapters support multiple input types (text, images, audio files)
# with conditional retrieval based on file uploads

adapters:
  - name: "simple-chat-with-files"
    enabled: true
    type: "passthrough"  # Passthrough adapter with file retrieval capabilities
    datasource: "none"  # No actual datasource needed (files managed separately)
    adapter: "multimodal"
    implementation: "implementations.passthrough.multimodal.MultimodalImplementation"
    # Provider overrides (optional - use when you want different providers than global defaults)
    inference_provider: "ollama_cloud"          # Override default inference provider
    model: "gpt-oss:120b"                # Specific model for this adapter
    embedding_provider: "cohere"
    embedding_model: "embed-v4.0"
    vision_provider: "cohere"           # Vision provider for image files: openai, gemini, anthropic (see vision.yaml)
    stt_provider: "whisper"               # STT provider for audio transcription (see stt.yaml)
    tts_provider: "gemini"               # For TTS output (see tts.yaml)
    # Optional generation parameter overrides - fall back to config/inference.yaml
    # defaults for the resolved inference_provider when omitted.
    # context_window: 128000
    # max_tokens: 16000
    # effort: "low"
    # Claude/OpenAI/Mistral/Gemini/xAI reasoning effort; ignored by providers that don't support it
    #
    # Optional: clients may request any of these models at runtime via the "model" field.
    # If omitted, the adapter always uses the model defined above. Each entry may also
    # carry its own optional temperature/max_tokens/context_window/effort overrides.
    # effort maps to each provider's reasoning control (Claude output_config.effort,
    # OpenAI/Mistral/xAI reasoning_effort, Gemini thinking_level); ignored where unsupported.
    allowed_models:
      - name: "minimax-m3"
        provider: "ollama_cloud"
        model: "minimax-m3:cloud"
        context_window: 512000
        max_tokens: 32768
        effort: "high"
      - name: "minimax-m2.7"
        provider: "ollama_cloud"
        model: "minimax-m2.7:cloud"
        context_window: 200000
        max_tokens: 24576
        effort: "medium"
      - name: "glm-5.2"
        provider: "ollama_cloud"
        model: "glm-5.2:cloud"
        context_window: 976000
        max_tokens: 32768
        effort: "high"
      - name: "glm-5.1"
        provider: "ollama_cloud"
        model: "glm-5.1:cloud"
        context_window: 198000
        max_tokens: 24576
        effort: "high"
      - name: "kimi-k3"
        provider: "ollama_cloud"
        model: "kimi-k3:cloud"
        context_window: 1000000
        max_tokens: 32768
        effort: "high"
      - name: "kimi-k2.7-code"
        provider: "ollama_cloud"
        model: "kimi-k2.7-code:cloud"
        context_window: 256000
        max_tokens: 24576
        effort: "high"
      - name: "deepseek-v4-flash"
        provider: "ollama_cloud"
        model: "deepseek-v4-flash:cloud"
        context_window: 1000000
        max_tokens: 32768
        effort: "medium"
      - name: "deepseek-v4-pro"
        provider: "ollama_cloud"
        model: "deepseek-v4-pro:cloud"
        context_window: 1000000
        max_tokens: 49152
        effort: "high"
      - name: "qwen3.5"
        provider: "ollama_cloud"
        model: "qwen3.5:cloud"
        context_window: 256000
        max_tokens: 16384
        effort: "medium"
      - name: "qwen3.5-397b"
        provider: "ollama_cloud"
        model: "qwen3.5:397b-cloud"
        context_window: 256000
        max_tokens: 32768
        effort: "high"
      - name: "gemma4"
        provider: "ollama_cloud"
        model: "gemma4:cloud"
        context_window: 256000
        max_tokens: 16384
        effort: "low"
      - name: "gemma4-31b"
        provider: "ollama_cloud"
        model: "gemma4:31b-cloud"
        context_window: 256000
        max_tokens: 24576
        effort: "low"
      - name: "mistral-large-3"
        provider: "ollama_cloud"
        model: "mistral-large-3:675b-cloud"
        context_window: 256000
        max_tokens: 32768
      - name: "deepseek"
        provider: "deepseek"
        model: "deepseek-chat"
        context_window: 65536
        max_tokens: 8000
      - name: "cohere"
        provider: "cohere"
        model: "command-a-03-2025"
        context_window: 256000
        max_tokens: 8000
      - name: "grok-4.3"
        provider: "xai"
        model: "grok-4.3"
        context_window: 1000000
        max_tokens: 16000
        effort: "low"           # Maps to reasoning_effort; ignored for models that don't support it (e.g. grok-4.3)
      - name: "gemma4-e2b"
        provider: "ollama"
        model: "gemma4-e2b-cpu"
        context_window: 8192
        max_tokens: 2048
      - name: "gpt-oss:120b"
        provider: "ollama_cloud"
        model: "gpt-oss:120b-cloud"
        context_window: 131072
        max_tokens: 32768
        effort: "medium"
      - name: "gpt-oss-20b"
        provider: "ollama_cloud"
        model: "gpt-oss:20b-cloud"
        context_window: 131072
        max_tokens: 16384
        effort: "low"
      - name: "claude"
        provider: "anthropic"
        model: "claude-sonnet-4-5-20250929"
        context_window: 1000000
        max_tokens: 64000
        effort: "low"           # Ignored for Claude models that don't support the effort parameter
      - name: "gemini"
        provider: "gemini"
        model: "gemini-3.6-flash"
        context_window: 1048576
        max_tokens: 65536
        effort: "low"           # Maps to thinking_level (minimal | low | medium | high)
      - name: "gpt-5.6-luna"
        provider: "openai"
        model: "gpt-5.6-luna"
        context_window: 1048576
        max_tokens: 65536
      - name: "nemotron-3-ultra"
        provider: "ollama_cloud"
        model: "nemotron-3-ultra:cloud"
        context_window: 256000
        max_tokens: 32768
        effort: "high"
      - name: "nemotron-3-super"
        provider: "ollama_cloud"
        model: "nemotron-3-super:cloud"
        context_window: 256000
        max_tokens: 32768
        effort: "high"
    # Capabilities: Multimodal - conditional file retrieval
    capabilities:
      retrieval_behavior: "conditional"  # Only retrieves when file_ids are present
      # ORBIT-only skills: auto-routed from natural language, NOT user-invokable.
      # They're intentionally kept out of available_skills, so the / picker won't
      # show them and an explicit skill=<name> for one of these is rejected.
      auto_routable_skills:
        - "Image"
        - "Video"
        - "PDF"
        - "Word"
        - "Excel"
        - "PowerPoint"
        - "CSV"
        - "Markdown"
        - "web-search"
      available_skills:
        - "Image"
        - "Video"
        - "Audio"
        - "PDF"
        - "Word"
        - "CSV"
        - "Excel"
        - "PowerPoint"
        - "HR"
        - "customer-360"
        - "business-analytics"
        - "customer-orders"
        - "web-search"
        - "Paris API"
        - "mcp-agent"
        - "web-search-duckduckgo"
        - "Fetch"
        - "Markdown"
      formatting_style: "clean"          # Clean format (no citations) to prevent LLM citation markers
      supports_charts: true               # Emit chart-formatting instructions when the turn looks chart-related (e.g. visualizing an uploaded CSV/spreadsheet)
      supports_threading: false
      # Automatic skill intent detection: infer a skill (PDF, Image, Audio, ...)
      # from plain natural language without the client sending skill=<name>.
      # Requires skill_routing.auto_detect: true in config.yaml to take effect.
      # NOTE: coexists with the mcp_tools flag below — skill detection runs first,
      # so a matched skill preempts the MCP loop for that turn (retrieval skills
      # and mcp-agent are never auto-routed). See docs/adapters/auto-skill-intent-detection.md
      auto_skill_routing: true
      supports_file_ids: true            # Accepts file_ids parameter for filtering
      supports_session_tracking: true    # Uses session_id for tracking
      requires_api_key_validation: true  # Validates file ownership via API key
      # Surface reachable skills' routing_examples (e.g. "search the web for",
      # "make a pdf of") as chat-input autocomplete suggestions. Since this adapter
      # has no retriever templates of its own, autocomplete draws entirely on the
      # routing_examples of the skills listed in auto_routable_skills/available_skills
      # above, rather than on nl_examples. See docs/autocomplete-architecture.md.
      supports_autocomplete: true
      requires_encryption: false         # Set true to require encrypted file storage (files.encryption.enabled must be true)
      skip_when_no_files: true           # Skip retrieval when file_ids is empty
      optional_parameters:
        - "file_ids"
        - "api_key"
        - "session_id"
      # Opportunistic MCP tool calling: the model may call these tools on any
      # turn without the client sending skill:"mcp-agent" — no adapter swap,
      # same thread throughout. Requires mcp_client.enabled: true AND
      # mcp_client.allow_opportunistic: true in config/mcp_client.yaml.
      # See docs/adapters/mcp-agent.md#opportunistic-mode.
      mcp_tools: true
      mcp_servers:              # allowlist — keep narrow; every enabled
        - "business-sample"      # conversational turn, not just tool-using ones

    config:
      # File adapter configuration (similar to file-document-qa)
      # Storage configuration
      storage_backend: "filesystem"  # Storage backend is selected globally via files.storage_backend in config.yaml (filesystem | s3 | minio | azure)
      storage_root: "./uploads"
      max_file_size: 52428800  # 50MB

      # Processing configuration
      # Chunking strategy options: "fixed", "semantic", "token", "recursive"
      # These settings override global defaults in config.yaml
      chunking_strategy: "recursive"  # "fixed", "semantic", "token", "recursive"
      chunk_size: 1000  # Increased to fit token-optimized CSV/JSON summaries in single chunks
      chunk_overlap: 100  # Characters for fixed/semantic, tokens for token/recursive

      # Vector store integration
      vector_store: "chroma"  # References stores.yaml
      collection_prefix: "files_"

      # Q&A settings - optimized for local LLMs with limited context (8K tokens)
      # 3 chunks × 2000 chars ≈ 6K chars, leaving room for system prompt + response
      confidence_threshold: 0.3
      max_results: 10       # Retrieve 5 chunks for good similarity matching
      return_results: 10    # Send top 3 to LLM to stay within context limits

  # Enhanced multimodal adapter with audio file transcription support
  - name: "simple-chat-with-files-audio"
    enabled: false
    type: "passthrough"  # Passthrough adapter with file retrieval and audio transcription
    datasource: "none"
    adapter: "multimodal"
    implementation: "implementations.passthrough.multimodal.MultimodalImplementation"
    # Provider overrides
    inference_provider: "ollama_cloud"
    model: "gpt-oss:120b"
    embedding_provider: "ollama"
    vision_provider: "gemini"             # For image files
    stt_provider: "gemini"                # For audio file transcription (see stt.yaml)
    tts_provider: "gemini"                # For TTS output (see tts.yaml)

    # Capabilities: Multimodal with audio support
    capabilities:
      retrieval_behavior: "conditional"
      formatting_style: "clean"
      supports_charts: true               # Emit chart-formatting instructions when the turn looks chart-related (e.g. visualizing an uploaded CSV/spreadsheet)
      supports_file_ids: true
      supports_session_tracking: true
      requires_api_key_validation: true
      requires_authenticated_user: false # Override auth.require_authenticated_user; leave off unless this adapter should require login
      requires_encryption: false         # Set true to require encrypted file storage (files.encryption.enabled must be true)
      skip_when_no_files: true
      optional_parameters:
        - "file_ids"
        - "api_key"
        - "session_id"

    config:
      # Storage configuration
      storage_backend: "filesystem"
      storage_root: "./uploads"
      max_file_size: 104857600  # 100MB (increased for audio files)

      # Audio processing settings
      enable_audio_transcription: true
      audio_transcription_language: null  # Auto-detect language

      # Processing configuration
      chunking_strategy: "recursive"
      chunk_size: 1000
      chunk_overlap: 200

      # Vector store integration
      vector_store: "chroma"
      collection_prefix: "files_"

      # Supported file types (including audio)
      supported_types:
        - "application/pdf"
        - "text/plain"
        - "text/markdown"
        - "text/csv"
        - "application/json"
        - "text/html"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        - "image/png"
        - "image/jpeg"
        - "image/tiff"
        - "audio/wav"
        - "audio/mpeg"
        - "audio/mp3"
        - "audio/ogg"
        - "audio/flac"
        - "audio/webm"

      # Q&A settings
      confidence_threshold: 0.3
      max_results: 5
      return_results: 3