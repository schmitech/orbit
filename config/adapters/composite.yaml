# Composite Intent Retriever Adapters
# These adapters route queries across multiple intent adapters
# by searching templates across all sources and routing to the best match
#
# MULTI-STAGE SELECTION (Improved Accuracy)
# =========================================
# The composite retriever now supports multi-stage template selection to
# significantly improve accuracy when routing across many templates with
# similar vocabulary across different business domains.
#
# Multi-stage selection is configured GLOBALLY in config.yaml under
# the composite_retrieval section:
#
#   composite_retrieval:
#     reranking:
#       enabled: true              # Use LLM reranker for semantic refinement
#       provider: "anthropic"      # Reranker from rerankers.yaml
#       top_candidates: 10         # Candidates to rerank
#       weight: 0.4                # Weight in combined score
#     string_similarity:
#       enabled: true              # Use Jaro-Winkler/Levenshtein
#       algorithm: "jaro_winkler"  # Or "levenshtein"
#       weight: 0.2                # Weight in combined score
#     scoring:
#       embedding_weight: 0.4      # Weight for embedding similarity
#
# How it works:
#   Stage 1: Embedding search (current) - fast semantic matching
#   Stage 2: Reranking (optional) - LLM-based semantic refinement
#   Stage 3: String similarity (optional) - lexical matching for precision
#   Final: Combined score = weighted sum of all enabled stages
#
# Example: Query "Show all employees"
#   Without multi-stage: might match "Show all customers" (similar embedding)
#   With multi-stage: reranker and string similarity boost "employees" match

adapters:
  # Example: Multi-Source Data Explorer
  # Routes queries across HR, EV Population, and DuckDB Analytics databases
  - name: "composite-multi-source-explorer"
    enabled: true  # Enable when child adapters are configured
    type: "retriever"
    adapter: "composite"
    implementation: "retrievers.implementations.composite.CompositeIntentRetriever"
    inference_provider: "openai"
    model: "gpt-5.4-mini"
    # Shared embedding provider for consistent similarity scoring across sources
    embedding_provider: "ollama"
    embedding_model: "nomic-embed-text:latest"
    capabilities:
      retrieval_behavior: "always"
      formatting_style: "standard"
      supports_charts: true       # Emit chart-formatting instructions when the turn looks chart-related
      supports_file_ids: false
      supports_session_tracking: false
      supports_threading: true
      requires_api_key_validation: true
      supports_autocomplete: true
    config:
      # Child adapters to search across
      # These must be names of other enabled intent adapters defined in intent.yaml
      child_adapters:
        - "intent-sql-sqlite-hr"
        - "intent-duckdb-analytics"
        - "intent-sql-postgres"

      # Minimum confidence score to consider a template match
      confidence_threshold: 0.5

      # Maximum templates to retrieve from each child adapter
      max_templates_per_source: 3

      # Whether to search all sources in parallel (recommended for performance)
      parallel_search: true

      # Timeout for template search per source (seconds)
      search_timeout: 5.0

      # Enable verbose logging for debugging routing decisions
      verbose: false

      # Cross-adapter templates for multi-source comparison queries
      # When a query matches a cross-adapter template, the composite retriever
      # routes to multiple child adapters in parallel and merges results.
      cross_adapter_templates:
        enabled: true
        template_library_path:
          - "examples/intent-templates/cross-adapter-template/cross_adapter_templates.yaml"
        template_collection_name: "composite_cross_adapter_templates"
        store_name: "chroma"

      # # Cross-adapter execution settings
      cross_adapter_execution:
        timeout_per_adapter: 10.0  # Timeout per child adapter query (seconds)
        partial_results: true       # Return results even if some adapters fail
        default_merge_strategy: "side_by_side"  # side_by_side or labeled_concat


  # Example: Customer 360 — Billing (SQLite) + Support SLA (HTTP)
  # Unlike the examples above, these two child adapters share the same
  # cus_XXXX customer ID space (see examples/mcp-server/src/data.js), so
  # cross-adapter queries genuinely join related domain data instead of
  # merely searching across unrelated topics. Requires the SLA mock server
  # to be running: `cd examples/mcp-server && npm run sla`.
  # See examples/customer-360-composite/README.md for the full walkthrough.
  - name: "composite-customer-360"
    enabled: true
    type: "retriever"
    adapter: "composite"
    implementation: "retrievers.implementations.composite.CompositeIntentRetriever"
    inference_provider: "openai"
    model: "gpt-5.4-mini"
    embedding_provider: "ollama"
    embedding_model: "nomic-embed-text:latest"
    allowed_models:
      - name: "minimax-m3"
        provider: "ollama_cloud"
        model: "minimax-m3:cloud"
        context_window: 512000
        max_tokens: 32768
        effort: "high"
      - name: "minimax-m2.7"
        provider: "ollama_cloud"
        model: "minimax-m2.7:cloud"
        context_window: 200000
        max_tokens: 24576
        effort: "medium"
      - name: "glm-5.2"
        provider: "ollama_cloud"
        model: "glm-5.2:cloud"
        context_window: 976000
        max_tokens: 32768
        effort: "high"
      - name: "glm-5.1"
        provider: "ollama_cloud"
        model: "glm-5.1:cloud"
        context_window: 198000
        max_tokens: 24576
        effort: "high"
      - name: "kimi-k3"
        provider: "ollama_cloud"
        model: "kimi-k3:cloud"
        context_window: 1000000
        max_tokens: 32768
        effort: "high"
      - name: "kimi-k2.7-code"
        provider: "ollama_cloud"
        model: "kimi-k2.7-code:cloud"
        context_window: 256000
        max_tokens: 24576
        effort: "high"
      - name: "deepseek-v4-flash"
        provider: "ollama_cloud"
        model: "deepseek-v4-flash:cloud"
        context_window: 1000000
        max_tokens: 32768
        effort: "medium"
      - name: "deepseek-v4-pro"
        provider: "ollama_cloud"
        model: "deepseek-v4-pro:cloud"
        context_window: 1000000
        max_tokens: 49152
        effort: "high"
      - name: "qwen3.5"
        provider: "ollama_cloud"
        model: "qwen3.5:cloud"
        context_window: 256000
        max_tokens: 16384
        effort: "medium"
      - name: "qwen3.5-397b"
        provider: "ollama_cloud"
        model: "qwen3.5:397b-cloud"
        context_window: 256000
        max_tokens: 32768
        effort: "high"
      - name: "gemma4"
        provider: "ollama_cloud"
        model: "gemma4:cloud"
        context_window: 256000
        max_tokens: 16384
        effort: "low"
      - name: "gemma4-31b"
        provider: "ollama_cloud"
        model: "gemma4:31b-cloud"
        context_window: 256000
        max_tokens: 24576
        effort: "low"
      - name: "mistral-large-3"
        provider: "ollama_cloud"
        model: "mistral-large-3:675b-cloud"
        context_window: 256000
        max_tokens: 32768
      - name: "deepseek"
        provider: "deepseek"
        model: "deepseek-chat"
        context_window: 65536
        max_tokens: 8000
      - name: "cohere"
        provider: "cohere"
        model: "command-a-03-2025"
        context_window: 256000
        max_tokens: 8000
      - name: "grok-4.3"
        provider: "xai"
        model: "grok-4.3"
        context_window: 1000000
        max_tokens: 16000
        effort: "low"           # Maps to reasoning_effort; ignored for models that don't support it (e.g. grok-4.3)
      - name: "gemma4-e2b"
        provider: "ollama"
        model: "gemma4-e2b-cpu"
        context_window: 8192
        max_tokens: 2048
      - name: "gpt-oss:120b"
        provider: "ollama_cloud"
        model: "gpt-oss:120b-cloud"
        context_window: 131072
        max_tokens: 32768
        effort: "medium"
      - name: "gpt-oss-20b"
        provider: "ollama_cloud"
        model: "gpt-oss:20b-cloud"
        context_window: 131072
        max_tokens: 16384
        effort: "low"
      - name: "claude"
        provider: "anthropic"
        model: "claude-sonnet-4-5-20250929"
        context_window: 1000000
        max_tokens: 64000
        effort: "low"           # Ignored for Claude models that don't support the effort parameter
      - name: "gemini"
        provider: "gemini"
        model: "gemini-3.6-flash"
        context_window: 1048576
        max_tokens: 65536
        effort: "low"           # Maps to thinking_level (minimal | low | medium | high)
      - name: "gpt-5.6-luna"
        provider: "openai"
        model: "gpt-5.6-luna"
        context_window: 1048576
        max_tokens: 65536
      - name: "nemotron-3-ultra"
        provider: "ollama_cloud"
        model: "nemotron-3-ultra:cloud"
        context_window: 256000
        max_tokens: 32768
        effort: "high"
      - name: "nemotron-3-super"
        provider: "ollama_cloud"
        model: "nemotron-3-super:cloud"
        context_window: 256000
        max_tokens: 32768
        effort: "high"
    capabilities:
      retrieval_behavior: "always"
      expose_as_skill: true
      skill_name: "customer-360"
      skill_description: "Cross-source billing + support SLA lookups"
      available_skills:
        - "Image"
        - "Video"
        - "Audio"
        - "PDF"
        - "Word"
        - "CSV"
        - "Excel"
        - "PowerPoint"
        - "web-search"
        - "mcp-agent"
        - "Fetch"
        - "Markdown"
      formatting_style: "standard"
      supports_charts: true       # Emit chart-formatting instructions when the turn looks chart-related
      supports_file_ids: false
      supports_session_tracking: false
      supports_threading: true
      requires_api_key_validation: true
      supports_autocomplete: true
      # Opportunistic MCP tool calling: lets the model also call the
      # business-sample MCP server's live CRM tools (customer health,
      # opportunities, support tickets) on any turn, alongside the composite
      # billing/SLA retrieval above. Requires mcp_clients.enabled: true AND
      # allow_opportunistic: true on the business-sample server in
      # config/mcp_clients.yaml. See docs/adapters/mcp-agent.md#opportunistic-mode.
      mcp_tools: true
      mcp_servers:
        - "business-sample"
    config:
      child_adapters:
        - "intent-sql-sqlite-billing"
        - "intent-http-sla-metrics"

      confidence_threshold: 0.4
      max_templates_per_source: 3
      parallel_search: true
      search_timeout: 8.0
      verbose: false

      cross_adapter_templates:
        enabled: true
        template_library_path:
          - "examples/intent-templates/cross-adapter-template/billing_sla_cross_adapter_templates.yaml"
        template_collection_name: "composite_customer360_cross_adapter_templates"
        store_name: "chroma"

      cross_adapter_execution:
        timeout_per_adapter: 10.0
        partial_results: true
        default_merge_strategy: "side_by_side"
  - name: "composite-full-explorer"
    enabled: false
    type: "retriever"
    adapter: "composite"
    implementation: "retrievers.implementations.composite.CompositeIntentRetriever"
    inference_provider: "openai"
    model: "gpt-5.4-mini"
    embedding_provider: "openrouter"
    embedding_model: "openai/text-embedding-3-small"
    capabilities:
      retrieval_behavior: "always"
      formatting_style: "standard"
      supports_charts: true       # Emit chart-formatting instructions when the turn looks chart-related
      supports_file_ids: false
      supports_session_tracking: false
      supports_threading: true
      requires_api_key_validation: true
      supports_autocomplete: true
    config:
      # Child adapters to search across
      child_adapters:
        # SQL databases
        - "intent-sql-sqlite-hr"
        # DuckDB databases
        - "intent-duckdb-analytics"
        - "intent-duckdb-ev-population"
        # MongoDB
        - "intent-mongodb-mflix"
        # HTTP APIs
        - "intent-http-paris-opendata"
        - "intent-http-jsonplaceholder"

      confidence_threshold: 0.35  # Lower threshold for diverse sources
      max_templates_per_source: 3
      parallel_search: true
      search_timeout: 8.0  # Higher timeout for HTTP sources
      verbose: true  # Enable verbose logging for debugging

      # Cross-adapter templates for multi-source comparison queries
      cross_adapter_templates:
        enabled: true
        template_library_path:
          - "examples/intent-templates/cross-adapter-template/cross_adapter_templates.yaml"
        template_collection_name: "composite_full_cross_adapter_templates"
        store_name: "chroma"

      # Cross-adapter execution settings
      cross_adapter_execution:
        timeout_per_adapter: 12.0
        partial_results: true
        default_merge_strategy: "side_by_side"