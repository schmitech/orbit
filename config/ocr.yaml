# AI/LLM-based document OCR configuration
#
# Powers the "ai_document" universal processor (see files.processing in
# config.yaml), a third option alongside Docling and MarkItDown. It offloads
# OCR for PDFs and images to an LLM inference service.
#
# Two kinds of backends:
#   - mistral / azure_mistral / gemini: native OCR (single call) — ingests a
#     PDF/image directly and returns extracted text. No rasterization.
#   - openai / anthropic / azure / ...: "vision-backed" — PDF pages are
#     rasterized to images and sent through the provider's vision model.
#     These reuse the per-provider settings from vision.yaml (visions:), so
#     the entries below only need an `enabled` flag to gate registration.
#
# NOTE: a Mistral Document AI / OCR model deployed on Azure AI Foundry is NOT
# reachable via the "azure" vision-backed entry — it doesn't implement the
# chat.completions API at all (404 api_not_supported). Use "azure_mistral"
# below instead, which speaks Mistral's native OCR protocol against Azure's
# dedicated OCR endpoint.
#
# The active provider is selected by files.processing.ai_document.provider.
# NOTE: that provider must also be `enabled: true` here to be registered.

ocr:
  provider: "gemini"   # Informational default; actual selection lives in files.processing.ai_document.provider

  # Mistral native OCR (dedicated endpoint, PDF/image-direct)
  mistral:
    enabled: true
    api_key: ${MISTRAL_API_KEY}
    model: "mistral-ocr-latest"
    # Timeout configuration
    timeout:
      connect: 15000   # 15 seconds
      total: 120000    # 120 seconds (OCR of multi-page PDFs can be slow)
    # Retry configuration
    retry:
      enabled: true
      max_retries: 3
      initial_wait_ms: 1000
      max_wait_ms: 30000
      exponential_base: 2

  # Mistral Document AI / OCR deployed on Azure AI Foundry (native OCR
  # protocol via the mistralai.azure client — NOT the OpenAI-compatible
  # chat.completions surface used by the "azure" vision-backed entry below).
  azure_mistral:
    enabled: false
    endpoint: ${AZURE_OCR_ENDPOINT}   # Copy the exact Target URI from the deployment's
                                       # Azure AI Foundry page, e.g.
                                       # https://<resource>.services.ai.azure.com/providers/mistral/azure/ocr
    api_key: ${AZURE_OCR_API_KEY}
    deployment_name: "mistral-document-ai-2505"   # Your Azure deployment/model name
    api_version: "2024-05-01-preview"

  # Gemini native document processing (single call, no rasterization)
  gemini:
    enabled: true
    api_key: ${GOOGLE_API_KEY}
    model: "gemini-3.6-flash"

  # Vision-backed providers — reuse settings from vision.yaml (visions:).
  # Enable the one you set as files.processing.ai_document.provider.
  openai:
    enabled: false
  anthropic:
    enabled: false
  cohere:
    enabled: false
  ollama:
    enabled: false
  vllm:
    enabled: false
  llama_cpp:
    enabled: false
  azure:
    enabled: false
