# Ruff configuration for the ORBIT project
# https://docs.astral.sh/ruff/configuration/

target-version = "py311"
line-length = 120

[lint.flake8-bugbear]
# FastAPI's dependency-injection idiom (Depends(...), Body(...), Query(...), etc.
# as argument defaults) triggers B008 even though the call result is immutable
# and evaluated once per request by design, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Cookie", "fastapi.Form", "fastapi.File", "fastapi.Security"]

[lint.per-file-ignores]
# Test files often import conftest or use late imports for fixtures
# BLE001: unit test fixtures/cleanup scripts routinely swallow arbitrary
# exceptions in setup/teardown; narrowing them is low value relative to
# production code. See docs/roadmap/ruff-blind-except-hardening.md.
"server/tests/**" = ["E402", "BLE001"]
# Bin entry points modify sys.path before importing the CLI
"bin/orbit.py" = ["E402"]
"bin/orbit/__main__.py" = ["E402"]
# Example and utility scripts often set up path/env before imports
"examples/**" = ["E402"]
"utils/**" = ["E402"]
