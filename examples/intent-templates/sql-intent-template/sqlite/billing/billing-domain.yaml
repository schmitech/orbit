    patterns:
    - customer
    - account
    regex_patterns:
    - \bcus_\d{4}\b
  currency_amount:
    description: Monetary amount
    patterns:
    - amount
    - price
    - cost
    - value
    - total
    regex_patterns:
    - \$\d+[,\d]*(\.\d{2})?
