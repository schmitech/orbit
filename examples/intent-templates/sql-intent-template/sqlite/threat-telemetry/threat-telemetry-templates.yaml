templates:
  # ============================================================================
  # DETECTION TEMPLATES
  # ============================================================================

  - id: list_critical_detections_recent
    description: List critical/high severity detections within a recent time window
    sql_template: |
      SELECT detection_id, sensor_id, detected_at, object_type, confidence, severity, notes
      FROM detections
      WHERE severity IN ('critical', 'high')
        AND detected_at >= datetime('now', '-' || ? || ' hours')
      ORDER BY detected_at DESC
      LIMIT ? OFFSET ?
    parameters:
      - name: hours_back
        type: integer
        description: Look-back window in hours
        required: false
        default: 1
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 100
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "Show critical detections in the last hour"
      - "What high severity detections happened in the last 24 hours?"
      - "List critical contacts from the last 6 hours"
    tags: [detection, critical, recent]
    result_format: table

  - id: detections_by_object_type
    description: Count detections grouped by object type within a time window
    sql_template: |
      SELECT object_type, COUNT(*) AS detection_count
      FROM detections
      WHERE detected_at >= datetime('now', '-' || ? || ' hours')
      GROUP BY object_type
      ORDER BY detection_count DESC
      LIMIT ? OFFSET ?
    parameters:
      - name: hours_back
        type: integer
        description: Look-back window in hours
        required: false
        default: 24
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 100
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "Break down detections by object type in the last 24 hours"
      - "How many aircraft vs vehicle detections today?"
      - "Show detection counts by type"
    tags: [detection, aggregate, object_type]
    result_format: table

  - id: detections_near_location
    description: Find detections near a named location
    sql_template: |
      SELECT d.detection_id, d.sensor_id, s.location_name, d.detected_at, d.object_type, d.severity
      FROM detections d
      JOIN sensors s ON s.sensor_id = d.sensor_id
      WHERE s.location_name LIKE '%' || ? || '%'
      ORDER BY d.detected_at DESC
      LIMIT ? OFFSET ?
    parameters:
      - name: location_name
        type: string
        description: Location name or partial match, for example "North Perimeter"
        required: true
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 100
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "What detections happened near North Perimeter?"
      - "Show detections at the East Gate sensor location"
      - "List contacts near Harbor Watch"
    tags: [detection, location, lookup]
    result_format: table

  - id: get_detection_by_id
    description: Get full detail for a specific detection
    sql_template: |
      SELECT d.detection_id, d.sensor_id, s.name AS sensor_name, s.location_name,
             d.detected_at, d.object_type, d.confidence, d.severity, d.lat, d.lon, d.notes
      FROM detections d
      JOIN sensors s ON s.sensor_id = d.sensor_id
      WHERE d.detection_id = ?
      LIMIT ? OFFSET ?
    parameters:
      - name: detection_id
        type: string
        description: Detection ID, for example det_00042
        required: true
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 100
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "Show me detection det_00042"
      - "Get details for detection det_00017"
      - "What are the details of detection det_00099?"
    tags: [detection, lookup]
    result_format: table

  # ============================================================================
  # SENSOR TEMPLATES
  # ============================================================================

  - id: list_sensor_status
    description: List all sensors with their current status
    sql_template: |
      SELECT sensor_id, name, type, location_name, status
      FROM sensors
      ORDER BY name ASC
      LIMIT ? OFFSET ?
    parameters:
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 100
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "Show sensor status"
      - "List all sensors"
      - "What is the status of our sensor network?"
    tags: [sensor, status]
    result_format: table

  - id: list_offline_sensors
    description: List sensors that are offline or degraded
    sql_template: |
      SELECT sensor_id, name, type, location_name, status
      FROM sensors
      WHERE status IN ('offline', 'degraded')
      ORDER BY name ASC
      LIMIT ? OFFSET ?
    parameters:
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 100
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "Which sensors are offline?"
      - "Show degraded or offline sensors"
      - "List sensors that need attention"
    tags: [sensor, offline, status]
    result_format: table

  - id: sensors_reporting_today
    description: List sensors that reported at least one detection today
    sql_template: |
      SELECT DISTINCT s.sensor_id, s.name, s.type, s.location_name
      FROM sensors s
      JOIN detections d ON d.sensor_id = s.sensor_id
      WHERE date(d.detected_at) = date('now')
      ORDER BY s.name ASC
      LIMIT ? OFFSET ?
    parameters:
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 100
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "Which sensors reported detections today?"
      - "Show sensors active today"
      - "List sensors with contacts today"
    tags: [sensor, detection, today]
    result_format: table

  # ============================================================================
  # ALERT TEMPLATES
  # ============================================================================

  - id: count_open_alerts
    description: Count alerts that are currently open
    sql_template: |
      SELECT COUNT(*) AS open_alert_count
      FROM alerts
      WHERE status = 'open'
      LIMIT ? OFFSET ?
    parameters:
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 100
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "How many open alerts are there right now?"
      - "Count open alerts"
      - "How many unresolved alerts do we have?"
    tags: [alert, count, open]
    result_format: summary

  - id: list_unresolved_alerts_by_severity
    description: List unresolved alerts joined with detection severity
    sql_template: |
      SELECT a.alert_id, a.status, a.raised_at, a.assigned_to, d.severity, d.object_type
      FROM alerts a
      JOIN detections d ON d.detection_id = a.detection_id
      WHERE a.status != 'resolved'
      ORDER BY d.severity DESC, a.raised_at ASC
      LIMIT ? OFFSET ?
    parameters:
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 100
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "List unresolved alerts by severity"
      - "Show open and acknowledged alerts ordered by severity"
      - "What alerts still need attention, sorted by severity?"
    tags: [alert, unresolved, severity]
    result_format: table

  - id: alerts_assigned_to_operator
    description: List alerts assigned to a specific operator
    sql_template: |
      SELECT alert_id, detection_id, raised_at, status, assigned_to
      FROM alerts
      WHERE assigned_to = ?
      ORDER BY raised_at DESC
      LIMIT ? OFFSET ?
    parameters:
      - name: assigned_to
        type: string
        description: Operator name, for example "J. Alvarez"
        required: true
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 100
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "Show alerts assigned to J. Alvarez"
      - "What alerts does operator M. Chen have?"
      - "List alerts handled by R. Singh"
    tags: [alert, operator, assigned]
    result_format: table

  # ============================================================================
  # ANALYTICS / INTELLIGENCE TEMPLATES
  # ============================================================================

  - id: detection_trend_hourly
    description: Hourly detection volume trend over a recent window, for spotting spikes
    sql_template: |
      SELECT strftime('%Y-%m-%d %H:00', detected_at) AS hour_bucket, COUNT(*) AS detection_count,
             SUM(CASE WHEN severity IN ('critical', 'high') THEN 1 ELSE 0 END) AS high_severity_count
      FROM detections
      WHERE detected_at >= datetime('now', '-' || ? || ' hours')
      GROUP BY hour_bucket
      ORDER BY hour_bucket ASC
      LIMIT ? OFFSET ?
    parameters:
      - name: hours_back
        type: integer
        description: Look-back window in hours
        required: false
        default: 24
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 100
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "Show the hourly detection trend for the last 24 hours"
      - "Is there a spike in detections today?"
      - "Plot detection volume by hour for the last 12 hours"
    tags: [detection, trend, hourly, analytics]
    result_format: table

  - id: detection_pattern_by_hour_of_day
    description: Detection density by hour of day across all history, revealing pattern-of-life
    sql_template: |
      SELECT CAST(strftime('%H', detected_at) AS INTEGER) AS hour_of_day, COUNT(*) AS detection_count
      FROM detections
      GROUP BY hour_of_day
      ORDER BY detection_count DESC
      LIMIT ? OFFSET ?
    parameters:
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 100
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "What time of day do we see the most detections?"
      - "Show detection pattern of life by hour"
      - "Is there a recurring time window with elevated activity?"
    tags: [detection, pattern, hour_of_day, analytics]
    result_format: table

  - id: top_sensors_by_detection_volume
    description: Rank sensors by number of detections reported within a time window
    sql_template: |
      SELECT s.sensor_id, s.name, s.type, s.location_name, COUNT(d.detection_id) AS detection_count
      FROM sensors s
      JOIN detections d ON d.sensor_id = s.sensor_id
      WHERE d.detected_at >= datetime('now', '-' || ? || ' hours')
      GROUP BY s.sensor_id, s.name, s.type, s.location_name
      ORDER BY detection_count DESC
      LIMIT ? OFFSET ?
    parameters:
      - name: hours_back
        type: integer
        description: Look-back window in hours
        required: false
        default: 24
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 10
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "Which sensors have reported the most detections in the last 24 hours?"
      - "Rank sensors by detection volume today"
      - "Show the busiest sensors in the last 6 hours"
    tags: [sensor, detection, ranking, analytics]
    result_format: table

  - id: sensor_critical_rate
    description: Percentage of each sensor's detections that are high/critical severity, a signal for hotspot sensors
    sql_template: |
      SELECT s.sensor_id, s.name, s.location_name,
             COUNT(d.detection_id) AS total_detections,
             SUM(CASE WHEN d.severity IN ('critical', 'high') THEN 1 ELSE 0 END) AS high_severity_detections,
             ROUND(100.0 * SUM(CASE WHEN d.severity IN ('critical', 'high') THEN 1 ELSE 0 END) / COUNT(d.detection_id), 1) AS high_severity_pct
      FROM sensors s
      JOIN detections d ON d.sensor_id = s.sensor_id
      GROUP BY s.sensor_id, s.name, s.location_name
      HAVING COUNT(d.detection_id) >= ?
      ORDER BY high_severity_pct DESC
      LIMIT ? OFFSET ?
    parameters:
      - name: min_detections
        type: integer
        description: Minimum detection count for a sensor to be included, to avoid noise from low-volume sensors
        required: false
        default: 5
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 10
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "Which sensors have the highest rate of critical detections?"
      - "Rank sensors by percentage of high severity contacts"
      - "Which locations are hotspots for critical activity?"
    tags: [sensor, severity, hotspot, analytics]
    result_format: table

  - id: object_type_severity_breakdown
    description: Severity distribution for each detected object type, showing which object types skew dangerous
    sql_template: |
      SELECT object_type, severity, COUNT(*) AS detection_count,
             ROUND(AVG(confidence), 2) AS avg_confidence
      FROM detections
      WHERE detected_at >= datetime('now', '-' || ? || ' hours')
      GROUP BY object_type, severity
      ORDER BY object_type ASC, detection_count DESC
      LIMIT ? OFFSET ?
    parameters:
      - name: hours_back
        type: integer
        description: Look-back window in hours
        required: false
        default: 72
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 100
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "Break down severity by object type"
      - "Which object types tend to be more critical?"
      - "Show severity distribution for aircraft vs vehicle contacts"
    tags: [detection, object_type, severity, analytics]
    result_format: table

  - id: low_confidence_high_severity_detections
    description: Flag detections that are high/critical severity but low confidence, candidates for review as possible false positives
    sql_template: |
      SELECT d.detection_id, d.sensor_id, s.name AS sensor_name, d.detected_at, d.object_type, d.confidence, d.severity, d.notes
      FROM detections d
      JOIN sensors s ON s.sensor_id = d.sensor_id
      WHERE d.severity IN ('critical', 'high')
        AND d.confidence < ?
      ORDER BY d.confidence ASC, d.detected_at DESC
      LIMIT ? OFFSET ?
    parameters:
      - name: confidence_threshold
        type: number
        description: Confidence below this value is flagged for review
        required: false
        default: 0.6
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 100
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "Show high severity detections with low confidence that might be false positives"
      - "Which critical contacts have confidence below 0.6?"
      - "Flag low-confidence critical detections for review"
    tags: [detection, confidence, severity, false_positive, analytics]
    result_format: table

  - id: corroborated_detections
    description: Find detections from different sensors within a short time window of each other, indicating multiple sensors corroborating the same contact
    sql_template: |
      SELECT d1.detection_id AS detection_a, d1.sensor_id AS sensor_a, d1.detected_at AS time_a,
             d2.detection_id AS detection_b, d2.sensor_id AS sensor_b, d2.detected_at AS time_b,
             d1.object_type
      FROM detections d1
      JOIN detections d2
        ON d1.object_type = d2.object_type
        AND d1.sensor_id < d2.sensor_id
        AND ABS(strftime('%s', d1.detected_at) - strftime('%s', d2.detected_at)) <= (? * 60)
      WHERE d1.detected_at >= datetime('now', '-' || ? || ' hours')
      ORDER BY d1.detected_at DESC
      LIMIT ? OFFSET ?
    parameters:
      - name: window_minutes
        type: integer
        description: Maximum minutes apart for two detections to be considered corroborating
        required: false
        default: 5
      - name: hours_back
        type: integer
        description: Look-back window in hours
        required: false
        default: 24
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 50
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "Which detections were corroborated by multiple sensors?"
      - "Find contacts of the same type seen by two sensors within 5 minutes of each other"
      - "Show multi-sensor corroborated detections in the last 24 hours"
    tags: [detection, corroboration, multi_sensor, analytics]
    result_format: table

  - id: stale_open_alerts
    description: Open or acknowledged alerts that have been outstanding longer than a threshold, for triage prioritization
    sql_template: |
      SELECT a.alert_id, a.status, a.raised_at, a.assigned_to, d.severity, d.object_type,
             CAST((strftime('%s', 'now') - strftime('%s', a.raised_at)) / 3600.0 AS INTEGER) AS hours_open
      FROM alerts a
      JOIN detections d ON d.detection_id = a.detection_id
      WHERE a.status != 'resolved'
        AND a.raised_at <= datetime('now', '-' || ? || ' hours')
      ORDER BY a.raised_at ASC
      LIMIT ? OFFSET ?
    parameters:
      - name: min_hours_open
        type: integer
        description: Minimum hours an alert has been outstanding to be included
        required: false
        default: 4
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 100
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "Which alerts have been open longer than 4 hours?"
      - "Show stale unresolved alerts needing triage"
      - "List alerts that are aging without resolution"
    tags: [alert, aging, triage, analytics]
    result_format: table

  - id: operator_workload_summary
    description: Summarize each operator's alert workload by status, for staffing/triage insight
    sql_template: |
      SELECT assigned_to,
             COUNT(*) AS total_alerts,
             SUM(CASE WHEN status = 'open' THEN 1 ELSE 0 END) AS open_count,
             SUM(CASE WHEN status = 'acknowledged' THEN 1 ELSE 0 END) AS acknowledged_count,
             SUM(CASE WHEN status = 'resolved' THEN 1 ELSE 0 END) AS resolved_count
      FROM alerts
      WHERE assigned_to IS NOT NULL
      GROUP BY assigned_to
      ORDER BY open_count DESC
      LIMIT ? OFFSET ?
    parameters:
      - name: limit
        type: integer
        description: Maximum number of records to return
        required: false
        default: 100
      - name: offset
        type: integer
        description: Number of records to skip
        required: false
        default: 0
    nl_examples:
      - "Summarize alert workload by operator"
      - "Which operator has the most open alerts?"
      - "Show alert status breakdown for each operator"
    tags: [alert, operator, workload, analytics]
    result_format: table
