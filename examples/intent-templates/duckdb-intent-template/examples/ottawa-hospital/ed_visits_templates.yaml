    SELECT
      epi_week,
      SUM(all_causes_visits) AS total_visits,
      SUM(respiratory_visits) AS respiratory_visits,
      ROUND(SUM(respiratory_visits) * 100.0 / SUM(all_causes_visits), 1) AS respiratory_pct
    FROM ed_visits
    GROUP BY epi_week
    ORDER BY respiratory_pct DESC
    LIMIT :limit
