# =============================================================================
# OVERALL TRENDS - ED visit patterns over time
# =============================================================================

- id: weekly_ed_totals
  description: Get total ED visits by week across all age groups
  sql: |
    SELECT
      epi_week,
      SUM(all_causes_visits) AS total_visits,
      SUM(respiratory_visits) AS total_respiratory,
      ROUND(SUM(respiratory_visits) * 100.0 / SUM(all_causes_visits), 1) AS respiratory_pct
    FROM ed_visits
    GROUP BY epi_week
    ORDER BY epi_week DESC
    LIMIT :limit
  parameters:
  - name: limit
    type: integer
    description: Number of weeks to return
    required: false
    default: 20
  nl_examples:
  - Show me weekly ED visits
  - How many emergency visits each week?
  - Weekly hospital visit trends
  - ED visit totals by week
  - Emergency department weekly summary
  result_format: table
  version: 1.0.0
  approved: true
  semantic_tags:
    action: calculate
    primary_entity: ed_visits
    qualifiers: [weekly, trends]
  tags: [weekly, trends, totals]

- id: respiratory_trend
