  tags: [respiratory, trends, illness]

- id: latest_week_summary
  description: Get the most recent week's ED visit summary
  sql: |
    SELECT
      epi_week,
      age_category,
      all_causes_visits,
      respiratory_visits,
      respiratory_pct
    FROM ed_visits
    WHERE epi_week = (SELECT MAX(epi_week) FROM ed_visits)
    ORDER BY
      CASE age_category
        WHEN '00 to 03 Years' THEN 1
        WHEN '04 to 11 Years' THEN 2
        WHEN '12 to 17 Years' THEN 3
        WHEN '18 to 54 Years' THEN 4
        WHEN '55 to 79 Years' THEN 5
        WHEN '80+ Years' THEN 6
      END
  parameters: []
  nl_examples:
  - What are the latest ED visit numbers?
  - Show me this week's emergency visits
  - Current ED visit summary
  - Most recent hospital visit data
  - Latest respiratory numbers
  result_format: table
  version: 1.0.0
  approved: true
  semantic_tags:
    action: find
    primary_entity: ed_visits
    qualifiers: [latest, summary]
  tags: [latest, current, summary]

# =============================================================================
# AGE GROUP ANALYSIS - Patterns by demographic
# =============================================================================

- id: visits_by_age_group
  description: Compare ED visits across age groups
  sql: |
    SELECT
      age_category,
      SUM(all_causes_visits) AS total_visits,
      SUM(respiratory_visits) AS respiratory_visits,
      ROUND(AVG(respiratory_pct), 1) AS avg_respiratory_pct
    FROM ed_visits
    GROUP BY age_category
    ORDER BY
      CASE age_category
        WHEN '00 to 03 Years' THEN 1
        WHEN '04 to 11 Years' THEN 2
        WHEN '12 to 17 Years' THEN 3
        WHEN '18 to 54 Years' THEN 4
        WHEN '55 to 79 Years' THEN 5
        WHEN '80+ Years' THEN 6
      END
  parameters: []
  nl_examples:
  - Compare ED visits by age group
  - Which age group has the most visits?
  - ED visits by demographic
  - Age breakdown of emergency visits
  - How do visits differ by age?
  result_format: table
  version: 1.0.0
  approved: true
  semantic_tags:
    action: compare
    primary_entity: ed_visits
    qualifiers: [age, demographic]
  tags: [age, demographic, comparison]

