# =============================================================================
# REFERENCE DATA - Metadata
# =============================================================================

- id: data_coverage
  description: Show data coverage and date range
  sql: |
    SELECT
      MIN(epi_week) AS earliest_week,
      MAX(epi_week) AS latest_week,
      COUNT(DISTINCT epi_week) AS weeks_covered,
      COUNT(*) AS total_records,
      COUNT(DISTINCT age_category) AS age_groups
    FROM ed_visits
  parameters: []
  nl_examples:
  - What data is available?
  - Show me data coverage
  - Date range of the data
  - How many weeks of data?
  result_format: summary
  version: 1.0.0
  approved: true
  semantic_tags:
    action: calculate
    primary_entity: ed_visits
    qualifiers: [reference, metadata]
  tags: [reference, coverage, metadata]

- id: list_age_categories
  description: List all age categories in the data
  sql: |
    SELECT DISTINCT
      age_category,
      COUNT(*) AS weeks_of_data,
      SUM(all_causes_visits) AS total_visits
    FROM ed_visits
    GROUP BY age_category
    ORDER BY
      CASE age_category
        WHEN '00 to 03 Years' THEN 1
        WHEN '04 to 11 Years' THEN 2
        WHEN '12 to 17 Years' THEN 3
        WHEN '18 to 54 Years' THEN 4
        WHEN '55 to 79 Years' THEN 5
        WHEN '80+ Years' THEN 6
      END
  parameters: []
  nl_examples:
  - What age groups are tracked?
  - List age categories
  - Show me all demographics
  - Age groups in the data
  result_format: table
  version: 1.0.0
  approved: true
  semantic_tags:
    action: find
    primary_entity: ed_visits
    qualifiers: [reference]
  tags: [reference, age, metadata]
