# =============================================================================
# TOTALS & STATISTICS - Summary metrics
# =============================================================================

- id: total_visits_summary
  description: Get overall summary statistics
  sql: |
    SELECT
      COUNT(DISTINCT epi_week) AS weeks_covered,
      SUM(all_causes_visits) AS total_visits,
      SUM(respiratory_visits) AS total_respiratory,
      ROUND(SUM(respiratory_visits) * 100.0 / SUM(all_causes_visits), 1) AS overall_respiratory_pct,
      ROUND(AVG(all_causes_visits), 0) AS avg_weekly_visits_per_age_group
    FROM ed_visits
  parameters: []
  nl_examples:
  - How many total ED visits?
  - Overall summary statistics
  - Total emergency visits
  - Database summary
  - How much data is available?
  result_format: summary
  version: 1.0.0
  approved: true
  semantic_tags:
    action: calculate
    primary_entity: ed_visits
    qualifiers: [summary, totals]
  tags: [summary, totals, statistics]

- id: weekly_average_by_age
  description: Calculate average weekly visits by age group
  sql: |
    SELECT
      age_category,
      ROUND(AVG(all_causes_visits), 0) AS avg_weekly_visits,
      ROUND(AVG(respiratory_visits), 0) AS avg_respiratory,
      ROUND(AVG(respiratory_pct), 1) AS avg_respiratory_pct
    FROM ed_visits
    GROUP BY age_category
    ORDER BY avg_weekly_visits DESC
  parameters: []
  nl_examples:
  - What is the average weekly visits by age?
  - Average ED visits per week
  - Typical visit numbers by age group
  - Weekly averages by demographic
  result_format: table
  version: 1.0.0
  approved: true
  semantic_tags:
    action: calculate
    primary_entity: ed_visits
    qualifiers: [average, weekly]
  tags: [average, weekly, age]

- id: busiest_weeks
  description: Find the busiest weeks for ED visits
