- id: vendor_concentration_analysis
  description: Analyze vendor market concentration and cross-government presence
  sql: |
    SELECT
        vendor_information AS vendor,
        COUNT(*) AS system_count,
        COUNT(DISTINCT government_organization) AS org_count,
        ROUND(100.0 * COUNT(*) / (SELECT COUNT(*) FROM ai_register WHERE vendor_information IS NOT NULL AND vendor_information != ''), 1) AS market_share_pct
    FROM ai_register
    WHERE vendor_information IS NOT NULL AND vendor_information != ''
    GROUP BY vendor_information
    ORDER BY system_count DESC
    LIMIT 20
  parameters: []
  nl_examples:
  - What is the vendor concentration?
  - Which vendors dominate?
  - Top AI vendors in government
  - Vendor market share analysis
  - AI supplier concentration
  - Who are the biggest AI providers?
  - Vendor dependency analysis
  result_format: table
  version: 1.0.0
  approved: true
  semantic_tags:
    action: analyze
    primary_entity: ai_register
    qualifiers:
    - vendor
    - concentration
  tags:
  - analyze
  - vendor
  - market
  - concentration

- id: organization_ai_maturity
  description: Assess AI maturity by organization based on production rate and portfolio diversity
  sql: |
    SELECT
        government_organization AS organization,
        COUNT(*) AS total_systems,
        COUNT(CASE WHEN ai_system_status_en = 'In production' THEN 1 END) AS in_production,
        COUNT(CASE WHEN ai_system_status_en = 'In development' THEN 1 END) AS in_development,
        ROUND(100.0 * COUNT(CASE WHEN ai_system_status_en = 'In production' THEN 1 END) / NULLIF(COUNT(*), 0), 1) AS production_rate_pct,
        COUNT(CASE WHEN developed_by_en = 'Government of Canada' THEN 1 END) AS built_in_house,
        COUNT(DISTINCT vendor_information) AS vendor_diversity
    FROM ai_register
    GROUP BY government_organization
    HAVING COUNT(*) >= 3
    ORDER BY production_rate_pct DESC, total_systems DESC
  parameters: []
  nl_examples:
  - Which organizations are most mature in AI?
  - AI maturity by department
  - Organization AI readiness
  - Who has the most production AI?
  - Department AI maturity scores
  - AI deployment success by organization
  - Production rate by department
  result_format: table
  version: 1.0.0
  approved: true
  semantic_tags:
    action: analyze
    primary_entity: ai_register
    qualifiers:
    - maturity
    - organization
  tags:
  - analyze
  - maturity
  - organization
  - production

- id: ai_adoption_trends
  description: Analyze AI adoption trends over time by capability type
  sql: |
    SELECT
        status_date AS year,
        COUNT(*) AS total_systems,
        COUNT(CASE WHEN LOWER(ai_system_capabilities_en) LIKE '%generative%' OR LOWER(ai_system_capabilities_en) LIKE '%llm%' THEN 1 END) AS generative_ai,
        COUNT(CASE WHEN LOWER(ai_system_capabilities_en) LIKE '%machine learning%' OR regexp_matches(ai_system_capabilities_en, '(?i)\bML\b') THEN 1 END) AS machine_learning,
        COUNT(CASE WHEN LOWER(ai_system_capabilities_en) LIKE '%chatbot%' THEN 1 END) AS chatbots,
        COUNT(CASE WHEN ai_system_status_en = 'In production' THEN 1 END) AS in_production
    FROM ai_register
