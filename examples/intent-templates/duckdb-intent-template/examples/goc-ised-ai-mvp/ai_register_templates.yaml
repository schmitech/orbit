- id: generative_ai_systems
  description: List all generative AI systems
  sql: |
    SELECT
        name_ai_system_en AS name,
        government_organization AS organization,
        ai_system_capabilities_en AS capabilities,
        ai_system_status_en AS status,
        vendor_information AS vendor,
        ai_system_primary_users_en AS users
    FROM ai_register
    WHERE ai_system_capabilities_en ILIKE '%generative%'
        OR ai_system_capabilities_en ILIKE '%chatbot%'
        OR ai_system_capabilities_en ILIKE '%LLM%'
        OR ai_system_capabilities_en ILIKE '%large language%'
        OR description_ai_system_en ILIKE '%generative ai%'
        OR description_ai_system_en ILIKE '%LLM%'
        OR description_ai_system_en ILIKE '%large language model%'
    ORDER BY government_organization, name_ai_system_en
