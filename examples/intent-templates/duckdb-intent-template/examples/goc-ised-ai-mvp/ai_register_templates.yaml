- id: ai_systems_for_organization
  description: List AI systems for a specific organization
  sql: |
    SELECT
        name_ai_system_en AS name,
        ai_system_status_en AS status,
        ai_system_capabilities_en AS capabilities,
        status_date,
        developed_by_en AS developed_by,
        vendor_information AS vendor
    FROM ai_register
    WHERE government_organization ILIKE '%' || :organization || '%'
    ORDER BY
        CASE ai_system_status_en
            WHEN 'In production' THEN 1
            WHEN 'In development' THEN 2
            WHEN 'Retired' THEN 3
            ELSE 4
        END,
        name_ai_system_en
  parameters:
  - name: organization
    type: string
    description: Organization name to search for (partial match)
    required: true
  nl_examples:
  - Show me AI systems for Health Canada
  - What AI does Transport Canada use?
