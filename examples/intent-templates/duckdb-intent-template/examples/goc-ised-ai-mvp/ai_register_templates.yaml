    SELECT
        name_ai_system_en AS name,
        government_organization AS organization,
        ai_system_capabilities_en AS capabilities,
        ai_system_status_en AS status,
        description_ai_system_en AS description
    FROM ai_register
    WHERE ai_system_capabilities_en ILIKE '%machine learning%'
        OR regexp_matches(ai_system_capabilities_en, '(?i)\bML\b')
        OR ai_system_capabilities_en ILIKE '%deep learning%'
        OR ai_system_capabilities_en ILIKE '%predictive%'
