- id: ai_systems_statistics
  description: Get summary statistics for all AI systems
  sql: |
    SELECT
        COUNT(*) AS total_systems,
        COUNT(DISTINCT government_organization) AS unique_organizations,
        COUNT(CASE WHEN ai_system_status_en = 'In production' THEN 1 END) AS in_production,
        COUNT(CASE WHEN ai_system_status_en = 'In development' THEN 1 END) AS in_development,
        COUNT(CASE WHEN ai_system_status_en = 'Retired' THEN 1 END) AS retired,
        COUNT(CASE WHEN involves_personal_information = 'Y' THEN 1 END) AS involves_personal_info,
        COUNT(CASE WHEN notification_ai = 'Y' THEN 1 END) AS with_ai_notification,
        COUNT(DISTINCT vendor_information) AS unique_vendors
    FROM ai_register
  parameters: []
  nl_examples:
  - Show me AI register statistics
  - Give me an overview of AI systems
  - Summary of federal AI deployments
  - What's the breakdown of AI systems?
  - AI register overview
  - Statistics for government AI
  - Federal AI summary
  - How is AI being used across government?
  result_format: summary
  version: 1.0.0
  approved: true
  semantic_tags:
    action: calculate
    primary_entity: ai_register
    qualifiers: []
  tags:
  - calculate
  - statistics
  - overview

- id: list_all_ai_systems
  description: List all AI systems with key details
  sql: |
    SELECT
        ai_register_id,
        name_ai_system_en AS name,
        government_organization AS organization,
        ai_system_status_en AS status,
        status_date,
        ai_system_capabilities_en AS capabilities,
        developed_by_en AS developed_by
    FROM ai_register
    ORDER BY status_date DESC, name_ai_system_en
    LIMIT :limit
  parameters:
  - name: limit
    type: integer
    description: Maximum number of records to return
    required: false
    default: 50
  nl_examples:
  - List all AI systems
  - Show me all registered AI
  - Display all AI applications
  - Get all AI tools
  - What AI systems exist?
  - Show the AI register
  - List federal AI systems
  result_format: table
  version: 1.0.0
  approved: true
  semantic_tags:
    action: find
    primary_entity: ai_register
    qualifiers: []
  tags:
  - find
  - list
  - all

