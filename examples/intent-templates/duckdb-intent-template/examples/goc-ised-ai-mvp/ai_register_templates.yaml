# =============================================================================
# THEMATIC ANALYSIS QUERIES
# =============================================================================

- id: common_themes_use_cases
  description: Identify common themes across AI use cases by analyzing capabilities
  sql: |
    SELECT
        theme,
        COUNT(*) AS system_count,
        ROUND(100.0 * COUNT(*) / (SELECT COUNT(*) FROM ai_register), 1) AS percentage
    FROM (
        SELECT
            CASE
                WHEN LOWER(ai_system_capabilities_en) LIKE '%generative%'
                    OR LOWER(ai_system_capabilities_en) LIKE '%llm%'
                    OR LOWER(ai_system_capabilities_en) LIKE '%large language%' THEN 'Generative AI / LLM'
                WHEN LOWER(ai_system_capabilities_en) LIKE '%chatbot%' THEN 'Chatbots / Conversational AI'
                WHEN LOWER(ai_system_capabilities_en) LIKE '%nlp%'
                    OR LOWER(ai_system_capabilities_en) LIKE '%natural language%' THEN 'Natural Language Processing'
                WHEN LOWER(ai_system_capabilities_en) LIKE '%machine learning%'
                    OR regexp_matches(ai_system_capabilities_en, '(?i)\bML\b')
                    OR LOWER(ai_system_capabilities_en) LIKE '%deep learning%' THEN 'Machine Learning'
                WHEN LOWER(ai_system_capabilities_en) LIKE '%computer vision%'
                    OR LOWER(ai_system_capabilities_en) LIKE '%image%'
                    OR LOWER(ai_system_capabilities_en) LIKE '%object recognition%' THEN 'Computer Vision / Image Analysis'
                WHEN LOWER(ai_system_capabilities_en) LIKE '%document%'
                    OR LOWER(ai_system_capabilities_en) LIKE '%ocr%'
                    OR LOWER(ai_system_capabilities_en) LIKE '%extraction%' THEN 'Document Processing / Extraction'
                WHEN LOWER(ai_system_capabilities_en) LIKE '%translat%' THEN 'Translation'
                WHEN LOWER(ai_system_capabilities_en) LIKE '%automation%'
                    OR LOWER(ai_system_capabilities_en) LIKE '%workflow%' THEN 'Process Automation'
                WHEN LOWER(ai_system_capabilities_en) LIKE '%classif%'
                    OR LOWER(ai_system_capabilities_en) LIKE '%categor%' THEN 'Classification / Categorization'
                WHEN LOWER(ai_system_capabilities_en) LIKE '%predict%'
                    OR LOWER(ai_system_capabilities_en) LIKE '%anomal%' THEN 'Predictive Analytics / Anomaly Detection'
                WHEN ai_system_capabilities_en IS NULL THEN 'Unspecified'
                ELSE 'Other Specialized AI'
            END AS theme
        FROM ai_register
    ) themes
    GROUP BY theme
    ORDER BY system_count DESC
  parameters: []
  nl_examples:
  - What are some common themes across the use cases?
  - What are the main AI themes?
  - Common use case patterns
  - How is AI being used thematically?
  - What types of AI are most common?
  - Categorize AI systems by theme
  - Breakdown of AI capabilities
  - What are the top AI use case categories?
  - Thematic analysis of AI systems
  result_format: table
  version: 1.0.0
  approved: true
  semantic_tags:
    action: analyze
    primary_entity: ai_register
    qualifiers:
    - themes
    - use_cases
  tags:
  - analyze
  - themes
  - patterns
  - categorization

