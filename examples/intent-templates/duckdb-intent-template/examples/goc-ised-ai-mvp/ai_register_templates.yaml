- id: search_ai_systems
  description: Search AI systems by keyword
  sql: |
    SELECT
        name_ai_system_en AS name,
        government_organization AS organization,
        ai_system_status_en AS status,
        ai_system_capabilities_en AS capabilities,
        description_ai_system_en AS description
    FROM ai_register
    WHERE name_ai_system_en ILIKE '%' || :keyword || '%'
        OR description_ai_system_en ILIKE '%' || :keyword || '%'
        OR ai_system_capabilities_en ILIKE '%' || :keyword || '%'
        OR government_organization ILIKE '%' || :keyword || '%'
    ORDER BY name_ai_system_en
    LIMIT :limit
  parameters:
  - name: keyword
    type: string
    description: Keyword to search for in AI system name, description, or capabilities
    required: true
  - name: limit
    type: integer
    description: Maximum number of records to return
    required: false
    default: 50
  nl_examples:
  - Search for legal AI
  - Find AI related to healthcare
  - Look for crop AI systems
  - Search immigration AI
  - Find security AI
  - AI systems about translation
  - Search for document AI
  result_format: table
  version: 1.0.0
  approved: true
  semantic_tags:
    action: find
    primary_entity: ai_register
    qualifiers:
    - keyword
  tags:
  - find
  - search
  - keyword

