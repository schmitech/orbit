    SELECT
        CASE notification_ai WHEN 'Y' THEN 'Yes' WHEN 'N' THEN 'No' ELSE notification_ai END AS notifies_users,
        COUNT(*) AS count,
        ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER(), 1) AS percentage
    FROM ai_register
    WHERE notification_ai IS NOT NULL
    GROUP BY notification_ai
    ORDER BY count DESC
  parameters: []
