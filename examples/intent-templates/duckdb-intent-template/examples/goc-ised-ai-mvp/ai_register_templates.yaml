- id: inhouse_vs_vendor_by_org
  description: Compare in-house vs vendor development patterns by organization
  sql: |
    SELECT
        government_organization AS organization,
        COUNT(*) AS total,
        COUNT(CASE WHEN developed_by_en = 'Government of Canada' THEN 1 END) AS in_house,
        COUNT(CASE WHEN developed_by_en = 'Vendor' THEN 1 END) AS vendor_built,
        COUNT(CASE WHEN developed_by_en = 'Open source' THEN 1 END) AS open_source,
        ROUND(100.0 * COUNT(CASE WHEN developed_by_en = 'Government of Canada' THEN 1 END) / NULLIF(COUNT(*), 0), 1) AS in_house_pct
    FROM ai_register
    GROUP BY government_organization
    HAVING COUNT(*) >= 3
    ORDER BY in_house_pct DESC
