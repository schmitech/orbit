- id: ai_systems_by_organization
  description: Count AI systems by government organization
  sql: |
    SELECT
        government_organization AS organization,
        COUNT(*) AS ai_system_count,
        COUNT(CASE WHEN ai_system_status_en = 'In production' THEN 1 END) AS in_production,
        COUNT(CASE WHEN ai_system_status_en = 'In development' THEN 1 END) AS in_development
    FROM ai_register
    GROUP BY government_organization
    ORDER BY ai_system_count DESC
  parameters: []
  nl_examples:
