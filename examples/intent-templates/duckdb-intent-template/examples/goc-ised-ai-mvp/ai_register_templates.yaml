  description: Summary of AI privacy and notification status
  sql: |
    SELECT
        COUNT(*) AS total_systems,
        COUNT(CASE WHEN involves_personal_information = 'Y' THEN 1 END) AS with_personal_info,
        ROUND(100.0 * COUNT(CASE WHEN involves_personal_information = 'Y' THEN 1 END) / COUNT(*), 1) AS pct_with_personal_info,
        COUNT(CASE WHEN notification_ai = 'Y' THEN 1 END) AS with_notification,
        ROUND(100.0 * COUNT(CASE WHEN notification_ai = 'Y' THEN 1 END) / COUNT(*), 1) AS pct_with_notification
    FROM ai_register
