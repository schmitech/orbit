- id: ai_systems_by_status
  description: Count AI systems by status
  sql: |
    SELECT
        ai_system_status_en AS status,
        COUNT(*) AS count,
        ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER(), 1) AS percentage
    FROM ai_register
    WHERE ai_system_status_en IS NOT NULL
    GROUP BY ai_system_status_en
    ORDER BY count DESC
  parameters: []
  nl_examples:
  - How many AI systems are in production?
  - Show AI systems by status
  - What's the status breakdown?
  - How many are in development vs production?
