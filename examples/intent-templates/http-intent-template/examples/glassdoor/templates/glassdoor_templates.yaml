# Glassdoor Company Data - OpenWeb Ninja Real-Time Glassdoor Data API Templates
# API: https://api.openwebninja.com/realtime-glassdoor-data
# Auth: x-api-key header (OPENWEB_NINJA_API_KEY), configured on the adapter
#
# Note: /company-overview, /company-reviews, /company-interviews and /company-salaries
# accept either a numeric Glassdoor company ID or a company name in company_id
# (e.g. "Shopify"), so they resolve in a single call. /company-jobs only accepts the
# numeric ID (names return HTTP 500); search_companies returns it.

templates:
  # ============================================================================
  # COMPANY SEARCH
  # ============================================================================

  - id: search_companies
    version: "1.0.0"
    description: "Search Glassdoor for companies by name or keyword and return their profile and overall rating"

    http_method: "GET"
    endpoint_template: "/company-search"

    headers:
      Accept: "application/json"

    query_params:
      query: "{{query}}"
      limit: "{{limit}}"

    parameters:
      - name: query
        type: string
        required: true
        description: "Company name or keyword to search for"
        location: "query"
        example: "Shopify"

      - name: limit
        type: integer
        required: false
        default: 10
        description: "Maximum number of companies to return"
        location: "query"
        min: 1
        max: 100

    response_mapping:
      items_path: "data"
      fields:
        - name: "company_id"
          path: "company_id"
          type: "integer"
        - name: "name"
          path: "name"
          type: "string"
        - name: "rating"
          path: "rating"
          type: "number"
        - name: "review_count"
          path: "review_count"
          type: "integer"
        - name: "salary_count"
          path: "salary_count"
          type: "integer"
        - name: "job_count"
          path: "job_count"
          type: "integer"
        - name: "headquarters_location"
          path: "headquarters_location"
          type: "string"
        - name: "company_size"
          path: "company_size"
          type: "string"
        - name: "industry"
          path: "industry"
          type: "string"
        - name: "company_type"
          path: "company_type"
          type: "string"
        - name: "revenue"
          path: "revenue"
          type: "string"
        - name: "ceo"
          path: "ceo"
          type: "string"
        - name: "year_founded"
          path: "year_founded"
          type: "integer"
        - name: "website"
          path: "website"
          type: "string"
        - name: "company_link"
          path: "company_link"
          type: "string"

    nl_examples:
      - "Search Glassdoor for Shopify"
      - "Find companies named Acme"
      - "Look up Microsoft on Glassdoor"
      - "What is the Glassdoor rating for Google?"
      - "Show me Glassdoor companies matching 'bank'"
      - "What is the Glassdoor company ID for Shopify?"
      - "How many reviews does Amazon have on Glassdoor?"

    semantic_tags:
      action: "search"
      primary_entity: "company"

    result_format: "table"
    tags: ["glassdoor", "company", "search", "profile", "rating"]

  # ============================================================================
  # COMPANY OVERVIEW
  # ============================================================================

  - id: get_company_overview
    version: "1.0.0"
    description: "Get the Glassdoor profile of a specific company: description, industry, size, headquarters, CEO, revenue, stock, competitors, and office locations"

    http_method: "GET"
    endpoint_template: "/company-overview"

    headers:
      Accept: "application/json"

    query_params:
      company_id: "{{company_id}}"

    parameters:
      - name: company_id
        type: string
        required: true
        description: "Company name (e.g. 'Shopify') or numeric Glassdoor company ID"
        location: "query"
        example: "Shopify"

    response_mapping:
      items_path: "data"
      fields:
        - name: "company_id"
          path: "company_id"
          type: "integer"
        - name: "name"
          path: "name"
          type: "string"
        - name: "company_description"
          path: "company_description"
          type: "string"
        - name: "industry"
          path: "industry"
          type: "string"
        - name: "company_type"
          path: "company_type"
          type: "string"
        - name: "company_size"
          path: "company_size"
          type: "string"
        - name: "headquarters_location"
          path: "headquarters_location"
          type: "string"
        - name: "year_founded"
          path: "year_founded"
          type: "integer"
        - name: "revenue"
          path: "revenue"
          type: "string"
        - name: "stock"
          path: "stock"
          type: "string"
        - name: "ceo"
          path: "ceo"
          type: "string"
        - name: "rating"
          path: "rating"
          type: "number"
        - name: "review_count"
          path: "review_count"
          type: "integer"
        - name: "job_count"
          path: "job_count"
          type: "integer"
        - name: "competitors"
          path: "competitors"
          type: "array"
        - name: "office_locations"
          path: "office_locations"
          type: "array"
        - name: "best_places_to_work_awards"
          path: "best_places_to_work_awards"
          type: "array"
        - name: "website"
          path: "website"
          type: "string"
        - name: "company_link"
          path: "company_link"
          type: "string"

    nl_examples:
      - "Tell me about Shopify"
      - "Give me an overview of Stripe"
      - "Who is the CEO of Netflix and how big is the company?"
      - "Where is Stripe headquartered and what industry is it in?"
      - "Who are Shopify's competitors?"
      - "Where are Google's offices?"
      - "What is Shopify's stock ticker and revenue?"
      - "Has Google won any best places to work awards?"
      - "When was Salesforce founded?"

    semantic_tags:
      action: "get"
      primary_entity: "company"
      qualifiers: ["overview", "profile"]

    result_format: "table"
    tags: ["glassdoor", "company", "overview", "profile", "competitors", "offices", "ceo"]

  # ============================================================================
  # COMPANY RATINGS BREAKDOWN
  # ============================================================================

