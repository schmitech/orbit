  - id: search_jobs
    version: "1.0.0"
    description: "Search Glassdoor job listings by keyword and location, with optional posting date, remote, and easy-apply filters"

    http_method: "GET"
    endpoint_template: "/job-search"

    headers:
      Accept: "application/json"

    query_params:
      query: "{{query}}"
      location: "{{location}}"
      date_posted: "{{date_posted}}"
      remote_only: "{{remote_only}}"
      easy_apply_only: "{{easy_apply_only}}"

    parameters:
      - name: query
        type: string
        required: true
        description: "Job title or keywords"
        location: "query"
        example: "data engineer"

      - name: location
        type: string
        required: true
        description: "City, state, or country"
        location: "query"
        example: "Toronto"

      - name: date_posted
        type: string
        required: false
        description: "Posting age: all, today, 3days, week, 2weeks, month"
        location: "query"
        allowed_values: ["all", "today", "3days", "week", "2weeks", "month"]

      - name: remote_only
        type: boolean
        required: false
        description: "Only remote jobs"
        location: "query"

      - name: easy_apply_only
        type: boolean
        required: false
        description: "Only jobs with Glassdoor Easy Apply"
        location: "query"

    response_mapping:
      items_path: "data.jobs"
      fields:
        - name: "job_title"
          path: "job_title"
          type: "string"
        - name: "company_name"
          path: "company_name"
          type: "string"
        - name: "location_name"
          path: "location_name"
          type: "string"
        - name: "rating"
          path: "rating"
          type: "number"
        - name: "salary_min"
          path: "salary_min"
          type: "number"
        - name: "salary_median"
          path: "salary_median"
          type: "number"
        - name: "salary_max"
          path: "salary_max"
          type: "number"
        - name: "salary_currency"
          path: "salary_currency"
          type: "string"
        - name: "salary_period"
          path: "salary_period"
          type: "string"
        - name: "age_in_days"
          path: "age_in_days"
          type: "integer"
        - name: "easy_apply"
          path: "easy_apply"
          type: "boolean"
        - name: "job_link"
          path: "job_link"
          type: "string"

    nl_examples:
      - "Find data engineer jobs in Toronto"
      - "Show remote software developer jobs in Canada"
      - "Nursing jobs in Vancouver posted this week"
      - "Easy apply marketing jobs in New York"
      - "Any product manager openings in Austin posted today?"

