  - id: get_company_jobs
    version: "1.0.0"
    description: "List open job postings at a company on Glassdoor, identified by its numeric Glassdoor company ID"

    http_method: "GET"
    endpoint_template: "/company-jobs"

    headers:
      Accept: "application/json"

    query_params:
      company_id: "{{company_id}}"
      sort: "{{sort}}"
      page: "{{page}}"

    parameters:
      - name: company_id
        type: integer
        required: true
        description: "Numeric Glassdoor company ID (e.g. 675933 for Shopify). Company names are not accepted by this endpoint."
        location: "query"
        example: 675933

      - name: sort
        type: string
        required: false
        description: "Job order: MOST_RELEVANT or MOST_RECENT (latest)"
        location: "query"
        allowed_values: ["MOST_RELEVANT", "MOST_RECENT"]

      - name: page
        type: integer
        required: false
        default: 1
        description: "Page of results"
        location: "query"
        min: 1

    response_mapping:
      items_path: "data.jobs"
      fields:
        - name: "job_title"
          path: "job_title"
          type: "string"
        - name: "company_name"
          path: "company_name"
          type: "string"
        - name: "location_name"
          path: "location_name"
          type: "string"
        - name: "rating"
          path: "rating"
