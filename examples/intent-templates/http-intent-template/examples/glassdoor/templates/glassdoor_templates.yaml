    endpoint_template: "/company-overview"

    headers:
      Accept: "application/json"

    query_params:
      company_id: "{{company_id}}"

    parameters:
      - name: company_id
        type: string
        required: true
        description: "Company name (e.g. 'Google') or numeric Glassdoor company ID"
        location: "query"
        example: "Google"

    response_mapping:
      items_path: "data"
      fields:
        - name: "name"
          path: "name"
          type: "string"
        - name: "rating"
          path: "rating"
          type: "number"
        - name: "review_count"
          path: "review_count"
          type: "integer"
        - name: "work_life_balance_rating"
          path: "work_life_balance_rating"
          type: "number"
        - name: "compensation_and_benefits_rating"
          path: "compensation_and_benefits_rating"
          type: "number"
        - name: "culture_and_values_rating"
          path: "culture_and_values_rating"
          type: "number"
        - name: "diversity_and_inclusion_rating"
          path: "diversity_and_inclusion_rating"
          type: "number"
        - name: "career_opportunities_rating"
          path: "career_opportunities_rating"
          type: "number"
        - name: "senior_management_rating"
          path: "senior_management_rating"
          type: "number"
        - name: "ceo"
          path: "ceo"
          type: "string"
        - name: "ceo_approval"
          path: "ceo_rating"
