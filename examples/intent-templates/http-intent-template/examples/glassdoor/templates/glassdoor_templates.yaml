          type: "number"
        - name: "salary_median"
          path: "salary_median"
          type: "number"
        - name: "salary_max"
          path: "salary_max"
          type: "number"
        - name: "salary_currency"
          path: "salary_currency"
          type: "string"
        - name: "salary_period"
          path: "salary_period"
          type: "string"
        - name: "age_in_days"
          path: "age_in_days"
          type: "integer"
        - name: "easy_apply"
          path: "easy_apply"
          type: "boolean"
        - name: "job_link"
          path: "job_link"
          type: "string"

    nl_examples:
      - "Show open jobs for company 675933"
      - "List job postings for Glassdoor company ID 9079"
      - "What are the latest openings at company 1651?"
      - "Jobs at employer id 675933"

