[pytest]
# Independent test root: this harness is an example, not part of server/tests.
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
addopts = -v --tb=short --strict-markers

# Mirrors the marker vocabulary in server/tests/pyproject.toml.
#   unit        - no server, no network, no API keys. Always runnable.
#   integration - needs the Node MCP server on MCP_URL.
#   slow        - drives a real LLM agent loop; costs money.
markers =
    unit: no network, no server, no API keys required
    integration: requires the MCP server to be running
    slow: runs a real LLM agent loop against a provider API
